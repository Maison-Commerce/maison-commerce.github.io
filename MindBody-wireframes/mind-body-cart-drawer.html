<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mind & Body — Cart drawer wireframe</title>
<style>
:root{--ink:#202220;--muted:#686b66;--line:#d7dad3;--wash:#f1f2ee;font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:16px}*{box-sizing:border-box}body{margin:0;background:#e6e8e3}button,select{font:inherit;color:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;background:white;border:1px solid var(--line);min-height:44px;padding:10px 14px}button:hover,a.primary:hover{background:#eceee8;color:#202220}button:disabled{opacity:.35;cursor:default}a{color:inherit}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #8a725b;outline-offset:3px}.primary{display:block;width:100%;text-align:center;background:var(--ink);border:1px solid var(--ink);color:white;font-weight:700;padding:15px;text-decoration:none;min-height:50px}.quiet{border:0;background:transparent;text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:13px}.fine{font-size:12px;color:var(--muted);line-height:1.5}.muted{color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:44px;letter-spacing:-1.7px;line-height:1.05}h2{font-size:22px;letter-spacing:-.6px}h3{font-size:16px;line-height:1.35}p{line-height:1.5}.eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:700;margin-bottom:12px}.page{background:white;max-width:1440px;margin:auto;min-height:100vh}.announcement{text-align:center;background:var(--wash);font-size:12px;padding:12px}.nav{display:flex;justify-content:space-between;align-items:center;padding:25px 5%;border-bottom:1px solid var(--line);gap:15px}.wordmark{font-size:25px;font-weight:800;letter-spacing:-1.2px;text-decoration:none}.wordmark span{font-weight:400}.navlinks{display:flex;gap:24px;font-size:14px}.back-content{padding:70px 7%;max-width:1050px}.back-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:36px}.back-card{border:1px solid var(--line);padding:24px}.back-image{height:220px;background:var(--wash);display:grid;place-items:center;text-align:center;margin-bottom:20px;font-weight:700;font-size:20px;line-height:1.6}.back-card p{margin:14px 0}.reviewbar{background:#202220;color:white;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.reviewbar strong{font-size:14px}.reviewbar small{display:block;color:#c5c8bf;font-size:12px;margin-top:5px}.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tools button,.tools select{background:transparent;color:white;border:1px solid #62665e;font-size:12px;min-height:36px;padding:8px}.tools option{color:#202220;background:white}.tools .active{background:white;color:#202220}.demo{font-size:12px;background:#f7f4df;color:#5b553b;text-align:center;padding:8px 15px;line-height:1.5}
dialog{inset:0;margin:0;border:0;padding:0;max-width:none;max-height:none;width:100%;height:100dvh;background:transparent;color:var(--ink);overflow:hidden}dialog::backdrop{background:rgb(25 28 24 / .4)}.dialog-layout{height:100%;display:flex;flex-direction:column}.stage{flex:1;min-height:0;display:flex;justify-content:flex-end}.drawer{background:white;width:490px;max-width:100%;height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 50px #0002;animation:slide .18s ease-out;container-type:inline-size}.stage.mobile{justify-content:center}.stage.mobile .drawer{width:375px}.head{padding:15px 22px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.head button{border:0;font-size:23px;line-height:1;min-width:44px}.shipping{padding:4px 22px 16px;font-size:13px;line-height:1.5}.track{height:5px;background:#e5e7e0;overflow:hidden;margin-top:10px}.track span{display:block;height:100%;background:#555d4e;transform-origin:left;transition:transform .18s}.scroll{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;border-top:1px solid var(--line);scrollbar-gutter:stable}.items{padding:0 22px}.item{padding:22px 0;border-bottom:1px solid var(--line)}.item-top{display:grid;grid-template-columns:68px 1fr;gap:14px}.pack{background:var(--wash);border:1px solid var(--line);height:84px;display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.5;font-weight:700;letter-spacing:.5px}.item-title{display:flex;justify-content:space-between;gap:8px;align-items:start}.item-title .quiet{margin:-10px -8px 0 0;white-space:nowrap}.flavor{font-size:13px;color:var(--muted);margin-top:5px}.plan{font-size:13px;margin-top:7px;display:block}.plan select{font-size:13px;border:1px solid var(--line);background:#fff;padding:7px;min-height:38px;max-width:100%}.item-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.stepper{display:flex;border:1px solid var(--line);align-items:center}.stepper button{border:0;min-width:44px;padding:9px}.stepper span{min-width:26px;text-align:center;font-size:14px}.price{text-align:right}.price strong{font-size:17px}.price .fine{margin-top:3px}.quantity-note{font-size:12px;margin-top:10px;color:#62665c}.switch-wrap{margin-top:14px;display:flex;align-items:stretch;gap:4px}.switch{flex:1;background:#f1f2ee;text-align:left;font-size:13px;line-height:1.5}.switch b{display:block}.dismiss{padding:5px;border:0;min-width:32px;background:transparent;color:#777}.included{padding:16px 22px;background:#f7f8f5;font-size:12px;line-height:1.65}.summary{padding:20px 22px}.sum-row{display:flex;justify-content:space-between;font-size:14px;gap:12px;margin:9px 0}.sum-row.total{font-size:18px;border-top:1px solid var(--line);padding-top:14px;margin-top:14px;font-weight:700}.summary .primary{margin-top:16px}.savings{color:#4b5b43}.offer-area{border-top:1px solid var(--line);padding:20px 22px 28px;background:#fafbf8}.offer-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.bundle{border:1px solid var(--line);padding:16px;margin-bottom:22px;background:#f0f2eb}.bundle p{font-size:13px;margin:8px 0 12px}.bundle .offer-head button{margin:-8px}.bundle button.add-bundle{width:100%;font-size:13px;background:white}.rail{display:flex;gap:10px;margin-top:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:5px}.addon{flex:1 0 46%;min-width:0;border:1px solid var(--line);padding:12px;background:white;scroll-snap-align:start}.addon .pack{height:65px;margin-bottom:10px}.addon h3{font-size:14px}.addon p{font-size:13px;margin:7px 0}.addon button{width:100%;font-size:13px}.footer{flex-shrink:0;padding:14px 22px max(15px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:white;box-shadow:0 -5px 18px #00000005}.footer .fine{text-align:center}.payments{display:flex;gap:5px;justify-content:center;margin:12px 0 8px;flex-wrap:wrap}.payments span{border:1px solid var(--line);padding:4px 6px;font-size:10px;font-weight:700}.status{padding:10px 22px;background:#eef1e9;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}.status:empty{display:none}.status button{padding:5px 8px;min-height:36px;font-size:12px}.empty{padding:30px 22px}.empty h2{font-size:28px;margin:12px 0}.empty p{font-size:14px;margin-bottom:25px}.recommendation{display:grid;grid-template-columns:60px 1fr;gap:13px;border-top:1px solid var(--line);padding:20px 0}.recommendation .pack{height:75px}.recommendation p{margin:6px 0 12px}.recommendation button{font-size:13px;width:100%}.empty-link{display:block;text-align:center;margin:20px 0;font-size:14px}.checkout-note{background:#f7f4df;padding:16px;font-size:14px;line-height:1.6;margin-top:15px}.hidden{display:none!important}@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@container(max-width:400px){.head,.shipping,.items,.summary,.empty{padding-left:16px;padding-right:16px}.offer-area,.footer{padding-left:16px;padding-right:16px}.item-top{grid-template-columns:58px 1fr;gap:11px}.addon{flex-basis:67%}.footer .fine{font-size:11px}.item-title h3{font-size:15px}}@media(max-width:600px){.reviewbar{padding:9px 12px;gap:8px}.reviewbar small{display:none}.reviewbar strong{font-size:12px}.tools{gap:4px}.tools button,.tools select{font-size:11px;padding:6px;min-height:32px}.demo{font-size:10px;padding:5px 10px}.drawer{width:100%}.stage.mobile .drawer{width:100%}.navlinks{display:none}.back-content{padding:40px 20px}.back-cards{grid-template-columns:1fr}.back-card:nth-child(n+2){display:none}.nav{padding:16px}.wordmark{font-size:21px}}@media(max-height:650px){.footer{padding-top:8px;padding-bottom:8px}.payments{margin:7px 0 4px}.head{padding-top:5px;padding-bottom:3px}.shipping{padding-bottom:8px}.reviewbar small{display:none}}
</style></head><body>
<div class="page" id="background"><div class="announcement" id="announcement"></div><nav class="nav"><a class="wordmark" id="home">Mind <span>&</span> Body</a><div class="navlinks"><a id="shop">Shop</a><a id="product">Daily Stack</a></div><button id="open-cart">Bag (1)</button></nav><main class="back-content"><div class="eyebrow">MIND & BODY</div><h1 id="back-title"></h1><div class="back-cards" id="back-cards"></div></main></div>
<dialog id="cart" aria-modal="true" aria-labelledby="cart-title"><div class="dialog-layout"><div class="reviewbar"><div><strong>Mind & Body — Cart drawer</strong><small>Interactive wireframe · 05</small></div><div class="tools"><button data-mode="desktop">Desktop</button><button data-mode="mobile">Mobile 375</button><button id="language">NL / EN</button><select id="scenario" aria-label="Cart scenario"></select></div></div><div class="demo" id="demo"></div><div class="stage" id="stage"><section class="drawer"><header class="head" id="drag-handle"><h2 id="cart-title"></h2><button id="close-cart" autofocus aria-label="Close cart">×</button></header><div class="shipping" id="shipping"></div><div class="status" id="status" role="status" aria-live="polite"></div><div class="scroll" id="scroll"></div><footer class="footer" id="footer"></footer></section></div></div></dialog>
<script>
const q=new URLSearchParams(location.search);
const state={lang:q.get('lang')==='nl'?'nl':'en',mobile:q.get('view')==='mobile',scenario:'once',items:[],dismissed:[],bundleDismissed:false,undo:null,message:'',checkout:false};
const catalog={adult:{name:'Daily Stack',pack:'DAILY<br>STACK',flavor:'Strawberry Lemonade',once:3499,monthly:2999,quarter:8097,days:30},kids:{name:'Kids Gummies',pack:'KIDS<br>GUMMIES',flavor:'Strawberry',once:2999,monthly:2499,days:30},tin:{name:'Travel Tin',pack:'TRAVEL<br>TIN',flavor:'',once:599},sleeve:{name:'Shaker Sleeve',pack:'SHAKER<br>SLEEVE',flavor:'',once:799},shaker:{name:'Daily Shaker',pack:'DAILY<br>SHAKER',flavor:'500 ml',once:1499}};
const t=(nl,en)=>state.lang==='nl'?nl:en;
const money=n=>new Intl.NumberFormat(state.lang==='nl'?'nl-NL':'en-IE',{style:'currency',currency:'EUR'}).format(n/100);
const link=(page,query='')=>(location.protocol==='file:'?'mind-body-'+page+'.html':page==='pdp'?'pdp-wireframe.html':page+'-wireframe.html')+'?lang='+state.lang+query;
const name=i=>i.id==='family'?'Family Bundle':catalog[i.id].name;
const planName=plan=>plan==='monthly'?t('Maandelijks abonnement','Monthly subscription'):plan==='quarter'?t('3 maanden vooruitbetaald','3-month prepaid subscription'):t('Eenmalige aankoop','One-time purchase');
function amount(i){if(i.id==='family')return Math.round((Math.round(2999*i.adults*(i.adults===2?.95:1))+2499)*.85);const p=catalog[i.id];return Math.round(p[i.plan]*i.qty*(i.id==='adult'&&i.qty===2?.95:1));}
function baseline(i){return i.id==='family'?3499*i.adults+2999:catalog[i.id].once*i.qty*(i.plan==='quarter'?3:1);}
function totals(){const subtotal=state.items.reduce((s,i)=>s+baseline(i),0),net=state.items.reduce((s,i)=>s+amount(i),0),sub=state.items.some(i=>i.plan!=='once'),shipping=!state.items.length||sub||net>=5000?0:495;return {subtotal,net,saving:subtotal-net,shipping,total:net+shipping,sub};}
function snapshot(){return {items:structuredClone(state.items),dismissed:[...state.dismissed],bundleDismissed:state.bundleDismissed};}
function change(fn,message){state.undo=snapshot();fn();state.message=message;state.checkout=false;render();}
function scenario(which){state.scenario=which;state.items=which==='empty'?[]:which==='family'?[{id:'family',adults:1,qty:1,plan:'monthly',flavor:'Strawberry Lemonade'}]:which==='mixed'?[{id:'adult',qty:1,plan:'monthly'},{id:'kids',qty:1,plan:'once'},{id:'tin',qty:1,plan:'once'}]:[{id:'adult',qty:1,plan:which==='quarter'?'quarter':which==='monthly'?'monthly':'once'}];state.dismissed=[];state.bundleDismissed=false;state.undo=null;state.message='';state.checkout=false;render();}
function count(){return state.items.reduce((s,i)=>s+(i.id==='family'?i.adults+1:i.qty),0);}
function familyCandidate(){if(state.bundleDismissed||state.items.some(i=>i.id==='family'))return null;const adult=state.items.find(i=>i.id==='adult'),kids=state.items.find(i=>i.id==='kids');if(Boolean(adult)===Boolean(kids))return null;const item=adult||kids;if(item.plan==='quarter'||item.id==='kids'&&item.qty!==1)return null;return {item,adults:adult?adult.qty:1};}
function additions(){return ['tin','sleeve','shaker'].filter(id=>!state.items.some(i=>i.id===id)&&catalog[id].once<=totals().net*.3).slice(0,2);}
function line(i){const p=catalog[i.id],family=i.id==='family',consumable=family||Boolean(p.days),days=i.plan==='quarter'?90:30;return `<article class="item"><div class="item-top"><div class="pack" aria-hidden="true">${family?'DAILY<br>+ KIDS':p.pack}</div><div><div class="item-title"><h3>${name(i)}</h3><button class="quiet" data-remove="${i.id}" aria-label="${t('Verwijder','Remove')} ${name(i)}">${t('Verwijder','Remove')}</button></div><p class="flavor">${family?(i.flavor||catalog.adult.flavor)+' + Strawberry':i.flavor||p.flavor||t('Eenmalig accessoire','One-time accessory')}</p>${consumable&&!family?`<label class="plan"><select aria-label="${t('Aankoopoptie voor','Purchase plan for')} ${name(i)}" data-plan="${i.id}">${(i.id==='adult'?['once','monthly','quarter']:['once','monthly']).map(plan=>`<option value="${plan}" ${i.plan===plan?'selected':''}>${planName(plan)}</option>`).join('')}</select></label>`:`<p class="plan">${planName(i.plan)}</p>`}${family?`<p class="fine">${i.adults} ${t('volwassene(n) + 1 kind · 15% bundelvoordeel','adult(s) + 1 child · 15% bundle savings')}</p>`:''}<div class="item-bottom">${family?`<span class="fine">${t('1 gezinsbundel','1 family bundle')}</span>`:`<div class="stepper"><button data-qty="${i.id}" data-delta="-1" aria-label="${t('Minder','Decrease')} ${name(i)}" ${i.qty===1?'disabled':''}>−</button><span>${i.qty}</span><button data-qty="${i.id}" data-delta="1" aria-label="${t('Meer','Increase')} ${name(i)}" ${i.qty===(i.id==='adult'?2:9)?'disabled':''}>+</button></div>`}<div class="price"><strong>${money(amount(i))}</strong>${consumable?`<div class="fine">${money(Math.round(amount(i)/(days*(family?1:i.qty))))}${family?t('/dag per gezin','/day per family'):t('/dag per persoon','/day per person')}</div>`:''}</div></div>${i.plan!=='once'?`<p class="fine" style="margin-top:8px">${money(amount(i))} ${i.plan==='quarter'?t('nu en elke 3 maanden; maandelijkse levering.','now and every 3 months; monthly delivery.'):t('nu en elke maand. Altijd opzegbaar.','now and every month. Cancel anytime.')}</p>`:''}${i.id==='adult'?`<div class="quantity-note">${i.qty===1?t('Voeg er 1 toe voor 5% extra voordeel.','Add 1 more for an extra 5% saving.'):t('5% voordeel voor 2 personen toegepast.','5% saving for 2 people applied.')}</div>`:''}</div></div>${consumable&&!family&&i.plan==='once'&&!state.dismissed.includes(i.id)?`<div class="switch-wrap"><button class="switch" data-upgrade="${i.id}"><b>↻ ${t('Maandelijks bestellen — bespaar','Switch to monthly — save')} ${money(amount(i)-amount({...i,plan:'monthly'}))}</b>${t('Gratis verzending · Altijd opzegbaar','Free shipping · Cancel anytime')}</button><button class="dismiss" data-dismiss="${i.id}" aria-label="${t('Verberg abonnementsaanbod','Dismiss subscription offer')}">×</button></div>`:''}</article>`;}
function summary(){const x=totals();return `<section class="summary" aria-label="${t('Besteloverzicht','Order summary')}"><div class="sum-row"><span>${t('Subtotaal vóór korting','Subtotal before savings')}</span><span>${money(x.subtotal)}</span></div>${x.saving?`<div class="sum-row savings"><span>${t('Je bespaart','You save')}</span><span>− ${money(x.saving)}</span></div>`:''}<div class="sum-row"><span>${t('Verzending · Nederland','Shipping · Netherlands')}</span><span>${x.shipping?money(x.shipping):t('Gratis','Free')}</span></div><div class="sum-row total"><span>${t('Totaal vandaag','Total today')}</span><span>${money(x.total)}</span></div><p class="fine">${t('Inclusief btw. Geen extra kosten voor bezorging in Nederland.','VAT included. No additional delivery charges within the Netherlands.')}</p>${state.checkout?`<div class="checkout-note" role="status">${t('Checkoutvoorbeeld:','Checkout preview:')} <b>${money(x.total)}</b>. ${t('In deze wireframe wordt geen bestelling geplaatst en geen betaling verwerkt.','This wireframe does not place an order or process a payment.')}</div>`:''}</section>`;}
function offers(){const c=familyCandidate(),a=c?[]:additions();if(!c&&!a.length)return '';let b='';if(c){const separate=Math.round(2999*c.adults*(c.adults===2?.95:1))+2499,bundled=Math.round(separate*.85);b=`<div class="bundle"><div class="offer-head"><h3>${t('Maak er een gezinsbundel van','Make it a family bundle')}</h3><button class="dismiss" data-dismiss-bundle aria-label="${t('Verberg bundelaanbod','Dismiss bundle offer')}">×</button></div><p>${t('Daily Stack + Kids Gummies. Eén levering, één rekening.','Daily Stack + Kids Gummies. One delivery, one bill.')}<br><b>${t('Bespaar','Save')} ${money(separate-bundled)} · 15%</b> ${t('op de losse maandabonnementen.','on separate monthly subscriptions.')}</p><p class="fine">${c.item.plan==='once'?t('Je eenmalige aankoop wordt een maandabonnement.','Your one-time purchase becomes a monthly subscription.'):''} ${t('Altijd opzegbaar.','Cancel anytime.')}</p><button class="add-bundle" data-bundle>${t('Wissel naar gezinsabonnement','Switch to family subscription')}<br><b>${money(bundled)}${t('/maand','/month')}</b></button></div>`;}return `<section class="offer-area">${b}${a.length?`<h3>${t('Vaak samen besteld','Frequently bought together')}</h3><div class="rail">${a.map(id=>`<article class="addon"><div class="pack" aria-hidden="true">${catalog[id].pack}</div><h3>${catalog[id].name}</h3><p>${money(catalog[id].once)}</p><button data-add="${id}">+ ${t('Toevoegen','Add')}</button></article>`).join('')}</div>`:''}</section>`;}
function empty(){return `<section class="empty"><div class="eyebrow">MIND & BODY</div><h2>${t('Je tas is nog leeg.','Your bag is empty.')}</h2><p>${t('Vind jouw dagelijkse basis.','Find your daily foundation.')}</p>${['adult','kids'].map(id=>`<article class="recommendation"><div class="pack" aria-hidden="true">${catalog[id].pack}</div><div><h3>${catalog[id].name}</h3><p class="fine">${catalog[id].flavor}<br>${money(catalog[id].monthly)}${t('/maand · Altijd opzegbaar','/month · Cancel anytime')}</p><button data-add="${id}">+ ${t('Maandabonnement toevoegen','Add monthly subscription')}</button></div></article>`).join('')}<a class="empty-link" href="${link('collection')}">${t('Bekijk alle producten','Explore all products')} →</a></section>`;}
function render(){const active=document.activeElement,key=active?.getAttribute('data-qty')||active?.getAttribute('data-plan'),delta=active?.getAttribute('data-delta'),x=totals();document.documentElement.lang=state.lang;document.getElementById('stage').classList.toggle('mobile',state.mobile);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',state.mobile===(b.dataset.mode==='mobile')));document.getElementById('language').textContent=state.lang==='nl'?'NL → EN':'EN → NL';document.getElementById('scenario').innerHTML=[['once',t('Eenmalig','One-time')],['monthly',t('Abonnement','Subscription')],['mixed',t('3 producten','3-item cart')],['family',t('Gezinsbundel','Family bundle')],['quarter',t('3 maanden','3-month plan')],['empty',t('Lege tas','Empty cart')]].map(([id,label])=>`<option value="${id}" ${id===state.scenario?'selected':''}>${label}</option>`).join('');document.getElementById('demo').textContent=t('Wireframe · Voorbeeldprijzen, producten en voorwaarden. Geen echte bestelling.','Wireframe · Sample prices, products and terms. No real orders.');document.getElementById('cart-title').textContent=t('Winkelwagen','Your bag')+' ('+count()+')';document.getElementById('close-cart').ariaLabel=t('Sluit winkelwagen','Close cart');document.getElementById('shipping').classList.toggle('hidden',!state.items.length);document.getElementById('shipping').innerHTML=x.sub?'✓ '+t('Gratis verzending bij je abonnement','Free shipping with your subscription'):x.net>=5000?'✓ '+t('Gratis verzending ontgrendeld','Free shipping unlocked'):`${t('Nog','You’re')} <b>${money(5000-x.net)}</b> ${t('voor gratis verzending','away from free shipping')}<div class="track" role="progressbar" aria-label="${t('Gratis verzending vanaf € 50','Free shipping from €50')}" aria-valuemin="0" aria-valuemax="5000" aria-valuenow="${x.net}" aria-valuetext="${money(5000-x.net)} ${t('te gaan','remaining')}"><span style="transform:scaleX(${x.net/5000})"></span></div>`;document.getElementById('status').innerHTML=state.message?`<span>${state.message}</span>${state.undo?`<button id="undo">${t('Ongedaan maken','Undo')}</button>`:''}`:'';document.getElementById('scroll').innerHTML=state.items.length?`<div class="items">${state.items.map(line).join('')}</div><div class="included">✓ <b>Foundations Guide</b> ${t('e-book inbegrepen bij elke aankoop.','e-book included with every purchase.')}${x.sub?'<br>✓ '+t('Communitytoegang inbegrepen. Welkomstpakket bij je eerste abonnement.','Community access included. Welcome kit with your first subscription.'):''}</div>${summary()}${offers()}`:empty();document.getElementById('footer').innerHTML=`${state.items.length?`<button class="primary" data-checkout>${t('Afrekenen','Checkout')} — ${money(x.total)} →</button>`:`<a class="primary" href="${link('collection')}">${t('Verder winkelen','Continue shopping')} →</a>`}<div class="payments" aria-label="${t('Betaalmethoden','Payment methods')}"><span>iDEAL</span><span>Klarna</span><span>VISA</span><span>Mastercard</span><span>PayPal</span></div><p class="fine">◇ ${t('30 dagen niet-goed-geld-terug','30-day money-back guarantee')}<br>${t('Vóór 23:00 besteld, morgen in huis (NL, ma–vr).','Order before 23:00, next-day delivery (NL, Mon–Fri).')}</p>`;document.getElementById('open-cart').textContent=t('Tas','Bag')+' ('+count()+')';document.getElementById('announcement').textContent=t('Gratis verzending bij elk abonnement · 30 dagen garantie','Free shipping with every subscription · 30-day guarantee');document.getElementById('home').href=link('homepage');document.getElementById('shop').href=link('collection');document.getElementById('product').href=link('pdp');document.getElementById('back-title').textContent=t('Jouw dagelijkse basis.','Your daily foundation.');document.getElementById('back-cards').innerHTML=['adult','kids','shaker'].map(id=>`<article class="back-card"><div class="back-image">MIND & BODY<br>${catalog[id].pack}</div><h3>${catalog[id].name}</h3><p>${t('Vanaf','From')} ${money(catalog[id].monthly||catalog[id].once)}</p><button data-open-add="${id}">+ ${t('Toevoegen','Add to bag')}</button></article>`).join('');bind();if(key){const selector=delta?`[data-qty="${key}"][data-delta="${delta}"]`:`[data-plan="${key}"]`;const el=document.querySelector(selector);(el?.disabled?document.querySelector(`[data-qty="${key}"]:not(:disabled)`):el)?.focus({preventScroll:true});}}
function add(id){change(()=>{const item=state.items.find(i=>i.id===id);if(item)item.qty=Math.min(item.qty+1,id==='adult'?2:9);else state.items.push({id,qty:1,plan:catalog[id].monthly?'monthly':'once'});},catalog[id].name+' '+t('toegevoegd.','added.'));}
function bind(){document.querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>change(()=>{const i=state.items.find(i=>i.id===b.dataset.qty);i.qty=Math.max(1,Math.min(i.qty+Number(b.dataset.delta),i.id==='adult'?2:9));},t('Aantal bijgewerkt.','Quantity updated.')));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{change(()=>state.items=state.items.filter(i=>i.id!==b.dataset.remove),t('Product verwijderd.','Item removed.'));document.getElementById('undo')?.focus({preventScroll:true});});document.querySelectorAll('[data-plan]').forEach(b=>b.onchange=()=>change(()=>{state.items.find(i=>i.id===b.dataset.plan).plan=b.value;},t('Aankoopoptie bijgewerkt.','Purchase plan updated.')));document.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>{change(()=>state.items.find(i=>i.id===b.dataset.upgrade).plan='monthly',t('Gewisseld naar maandelijks.','Switched to monthly.'));document.getElementById('undo')?.focus({preventScroll:true});});document.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=()=>{state.dismissed.push(b.dataset.dismiss);render();document.querySelector(`[data-plan="${b.dataset.dismiss}"]`)?.focus({preventScroll:true});});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{add(b.dataset.add);document.getElementById('undo')?.focus({preventScroll:true});});document.querySelectorAll('[data-open-add]').forEach(b=>b.onclick=()=>{add(b.dataset.openAdd);openCart();});document.querySelector('[data-dismiss-bundle]')?.addEventListener('click',()=>{state.bundleDismissed=true;render();document.querySelector('[data-checkout]')?.focus({preventScroll:true});});document.querySelector('[data-bundle]')?.addEventListener('click',()=>{const c=familyCandidate();if(!c)return;change(()=>{state.items=state.items.filter(i=>i!==c.item);state.items.unshift({id:'family',adults:c.adults,qty:1,plan:'monthly',flavor:c.item.id==='adult'?(c.item.flavor||catalog.adult.flavor):catalog.adult.flavor});},t('Gezinsabonnement toegevoegd.','Family subscription added.'));document.getElementById('undo')?.focus({preventScroll:true});});document.getElementById('undo')?.addEventListener('click',()=>{if(!state.undo)return;Object.assign(state,state.undo);state.undo=null;state.message=t('Wijziging ongedaan gemaakt.','Change undone.');state.checkout=false;render();document.getElementById('close-cart').focus({preventScroll:true});});document.querySelectorAll('[data-checkout]').forEach(b=>b.onclick=()=>{state.checkout=true;state.message=t('Checkoutvoorbeeld — geen betaling of bestelling.','Checkout preview — no payment or order.');state.undo=null;render();const note=document.querySelector('.checkout-note');note?.scrollIntoView({block:'nearest',behavior:'instant'});document.getElementById('footer').querySelector('button')?.focus({preventScroll:true});});}
const dialog=document.getElementById('cart');let lastFocus=null;function openCart(){lastFocus=document.activeElement===document.body?document.getElementById('open-cart'):document.activeElement;dialog.showModal();document.body.style.overflow='hidden';}function closeCart(){dialog.close();document.body.style.overflow='';(lastFocus?.isConnected?lastFocus:document.getElementById('open-cart')).focus();}document.getElementById('open-cart').onclick=openCart;document.getElementById('close-cart').onclick=closeCart;dialog.addEventListener('cancel',e=>{e.preventDefault();closeCart();});document.getElementById('stage').onclick=e=>{if(e.target.id==='stage')closeCart();};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mobile=b.dataset.mode==='mobile';render();});document.getElementById('language').onclick=()=>{state.lang=state.lang==='nl'?'en':'nl';state.message='';render();};document.getElementById('scenario').onchange=e=>scenario(e.target.value);let touchY=null;document.getElementById('drag-handle').addEventListener('touchstart',e=>touchY=e.touches[0].clientY,{passive:true});document.getElementById('drag-handle').addEventListener('touchend',e=>{if(touchY!==null&&e.changedTouches[0].clientY-touchY>80)closeCart();touchY=null;},{passive:true});scenario(['once','monthly','mixed','family','quarter','empty'].includes(q.get('scenario'))?q.get('scenario'):'once');openCart();
</script></body></html>
