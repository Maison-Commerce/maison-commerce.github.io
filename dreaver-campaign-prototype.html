<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreaver Campaign Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* ============ Prototype chrome (not part of the site) ============ */
:root{
  --ui-bg:#e9e7e4; --ui-card:#ffffff; --ui-ink:#17191c; --ui-mute:#6b6f76; --ui-line:#dcd9d5;
  --new:#7c3aed; --chg:#e8590c; --qa:#0284c7; --opt:#15803d;
  /* Dreaver tokens pulled from dreaver.nl */
  --petrol:#023130; --petrol-10:rgba(2,49,48,.10); --petrol-06:rgba(2,49,48,.06);
  --lilac:#DFBAFF; --lilac-soft:#F1E3FF; --purple:#4B3C6E;
  --sand:#F1EEEC; --surface:#F9F8F7; --cream:#F6F1EA; --white:#fff;
  --red:#C00036; --line:rgba(2,49,48,.12); --tp:#00B67A; --klarna:#FFA8CD;
  --ink:#023130;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--ui-bg);color:var(--ui-ink);font-size:14px;overflow:hidden}
button{font:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh}
.pt-bar{background:var(--ui-card);border-bottom:1px solid var(--ui-line);flex:none;z-index:50}
.pt-row{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.pt-row + .pt-row{padding-top:0}
.pt-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;margin-right:6px;white-space:nowrap}
.pt-title small{font-weight:500;color:var(--ui-mute);font-size:12px}
.pt-dot{width:10px;height:10px;border-radius:50%;background:var(--petrol)}
.seg{display:inline-flex;background:#f1f0ee;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:500;color:#3d4046;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ui-ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.pt-sel{border:1px solid var(--ui-line);border-radius:9px;padding:6px 8px;font:inherit;font-size:12.5px;background:#fff;max-width:150px}
.tgl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#3d4046;user-select:none;cursor:pointer;white-space:nowrap}
.tgl input{display:none}
.tgl i{width:30px;height:18px;border-radius:9px;background:#cfccc8;position:relative;transition:.15s}
.tgl i:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.tgl input:checked + i{background:var(--petrol)}
.tgl input:checked + i:after{left:14px}
.pt-spacer{flex:1}
.timeline{display:flex;gap:5px;overflow-x:auto;padding:8px 16px 12px;scrollbar-width:thin}
.tl{flex:none;border:1px solid var(--ui-line);background:#fff;border-radius:10px;padding:6px 9px 7px;text-align:left;min-width:92px;position:relative}
.tl b{display:block;font-size:12px;font-weight:600;white-space:nowrap}
.tl span{display:block;font-size:11px;color:var(--ui-mute);white-space:nowrap;margin-top:1px}
.tl em{position:absolute;top:-7px;right:6px;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:6px;background:#efeeec;color:#555}
.tl.ab{background:repeating-linear-gradient(135deg,#fafaf9,#fafaf9 6px,#f2f1ef 6px,#f2f1ef 12px)}
.tl.on{border-color:var(--petrol);background:var(--petrol);color:#fff}
.tl.on span{color:rgba(255,255,255,.75)}
.tl.on em{background:var(--lilac);color:var(--purple)}
.tl-month{flex:none;align-self:center;font-size:10px;font-weight:700;color:#9a9ea5;letter-spacing:.08em;writing-mode:vertical-rl;transform:rotate(180deg);padding:0 2px}
.pt-main{flex:1;display:flex;min-height:0}
.pt-stagewrap{flex:1;position:relative;min-width:0}
.pt-stage{position:absolute;inset:0;overflow:auto;scroll-behavior:smooth}
.pt-panel{width:360px;flex:none;background:var(--ui-card);border-left:1px solid var(--ui-line);overflow:auto;padding:18px 18px 40px}
.pt-panel.hide{display:none}
.pp-kicker{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ui-mute);text-transform:uppercase}
.pp-h{font-size:18px;font-weight:700;margin:4px 0 2px}
.pp-dates{color:var(--ui-mute);font-size:12.5px}
.pp-clock{margin:12px 0;background:#f5f4f2;border-radius:10px;padding:9px 11px;font-size:12px;display:flex;gap:8px;align-items:center}
.pp-clock b{font-variant-numeric:tabular-nums}
.pp-block{margin:14px 0}
.pp-block h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ui-mute)}
.pp-block p{margin:0;line-height:1.5;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:#444;margin:10px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.chitem{border:1px solid var(--ui-line);border-radius:12px;padding:10px 11px 10px 40px;position:relative;cursor:pointer;transition:.15s;background:#fff}
.chitem:hover,.chitem.hl{border-color:#b9b5b0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chitem .n{position:absolute;left:10px;top:10px;width:22px;height:22px;border-radius:7px;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.chitem .ty{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.chitem b{display:block;font-size:13px;margin:2px 0 3px}
.chitem p{margin:0;font-size:12.5px;line-height:1.45;color:#3d4046}
.chitem.missing{opacity:.55}
.chitem.missing:after{content:"Not rendered for this product";display:block;font-size:11px;color:var(--ui-mute);margin-top:4px;font-style:italic}
.t-new{background:var(--new)} .c-new{color:var(--new)}
.t-changed{background:var(--chg)} .c-changed{color:var(--chg)}
.t-qa{background:var(--qa)} .c-qa{color:var(--qa)}
.t-opt{background:var(--opt)} .c-opt{color:var(--opt)}
.pp-pages{display:flex;flex-wrap:wrap;gap:6px}
.pp-pages button{border:1px solid var(--ui-line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px}
.pp-pages button.on{background:var(--ui-ink);color:#fff;border-color:var(--ui-ink)}
.pp-pages button.zero{color:#9a9ea5}
.tbc-list{margin:0;padding-left:18px;font-size:12.5px;line-height:1.5}
.pp-note{background:#fff8e6;border:1px solid #f3e2b3;border-radius:10px;padding:10px 11px;font-size:12.5px;line-height:1.45}
.pp-empty{background:#f5f4f2;border-radius:10px;padding:12px;font-size:12.5px;color:#555;line-height:1.45}
.kbd{font-size:11px;color:var(--ui-mute)}
.kbd kbd{border:1px solid var(--ui-line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-family:inherit;font-size:10.5px;background:#fff}

/* change marks on the site */
.site.marks [data-chg]{outline:2px solid var(--mc,var(--new));outline-offset:3px;position:relative}
.site.marks [data-chg][data-t="changed"]{--mc:var(--chg)}
.site.marks [data-chg][data-t="qa"]{--mc:var(--qa);outline-style:dashed}
.site.marks [data-chg][data-t="opt"]{--mc:var(--opt);outline-style:dashed}
.site.marks [data-chg][data-n]:before{content:attr(data-n);position:absolute;z-index:30;top:-13px;left:-13px;min-width:24px;height:24px;border-radius:8px;background:var(--mc,var(--new));color:#fff;font:700 12px/24px Inter,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;padding:0 4px;letter-spacing:0;text-transform:none;font-style:normal}
.site.marks .sec[data-chg]{outline-offset:-3px}
.site.marks .sec[data-chg][data-n]:before{top:8px;left:8px}
.site.marks .ann.sec[data-chg][data-n]:before{top:50%;margin-top:-12px}
.site.marks [data-chg].flash{animation:flash 1.2s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}30%{box-shadow:0 0 0 10px rgba(255,200,0,.55)}}
.site.dim .sec:not([data-chg]):not(:has([data-chg])){opacity:.28;filter:grayscale(.6)}
.site.dim header.sec, .site.dim .ann.sec{opacity:1}
.basebadge{position:sticky;top:0;z-index:40;background:#17191c;color:#fff;text-align:center;font-size:12px;padding:6px;font-weight:600;letter-spacing:.02em}

/* ============ Site (Dreaver styling) ============ */
.site{container-type:inline-size;container-name:site;background:var(--surface);color:var(--ink);font-family:Inter,sans-serif;font-size:14px;line-height:1.6;margin:0 auto;max-width:1320px;min-height:100%;position:relative}
.stage-mobile .site{width:390px;margin:24px auto 60px;border-radius:30px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 8px #17191c;min-height:780px}
.stage-mobile .site.marks{overflow:visible}
.site a:not(.btn){color:inherit}
.site .btn{cursor:pointer}
.serif{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:400}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.sec{position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--lilac);color:var(--purple);font-weight:600;font-size:14px;padding:18px 32px;border-radius:60px;text-decoration:none;border:0;line-height:1.2;text-transform:none}
.btn.dark{background:var(--petrol);color:#FAF5EB}
.btn.ghost{background:transparent;border:1.5px solid currentColor}
.btn.block{display:flex;width:100%}
.btn.sm{padding:12px 20px;font-size:13px}
.chip{display:inline-block;background:var(--petrol-10);color:var(--petrol);font-size:12px;padding:5px 12px;border-radius:100px;white-space:nowrap}
.pill{display:inline-block;background:var(--petrol);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.red{background:var(--red)}
.pill.lilac{background:var(--lilac);color:var(--purple)}
.gratis{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:600;padding:1px 8px;border-radius:999px;letter-spacing:.02em}
.tbc{background:linear-gradient(transparent 62%,rgba(255,213,79,.55) 62%);border-bottom:1.5px dotted #b8860b;cursor:help;white-space:nowrap}
.ph{background:repeating-linear-gradient(135deg,#ece7e1,#ece7e1 10px,#e4ded6 10px,#e4ded6 20px);display:grid;place-items:center;text-align:center;color:#7a6f63;font-size:12px;font-weight:600;padding:16px;border-radius:inherit}
.ph small{display:block;font-weight:400;margin-top:3px}
.h2{font-size:32px;line-height:1.1;font-weight:700;color:var(--purple);margin:0}
.h2 .serif{display:block;font-weight:400;color:var(--purple)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.muted{opacity:.72}
img{max-width:100%;display:block}
img.broken{visibility:hidden}

/* announcement + header */
.ann{background:var(--petrol);color:#F9F8F7;text-align:center;padding:10px 16px;font-size:14px;line-height:1.35}
.ann b{font-weight:700;letter-spacing:.02em;margin-right:8px}
.ann .serif{font-style:normal;font-size:15px}
.ann .cdi{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(255,255,255,.12);padding:1px 8px;border-radius:6px;margin:0 4px;font-family:Inter,sans-serif}
.ann u{text-underline-offset:3px}
.hdr{background:var(--sand);}
.hdr .wrap{display:flex;align-items:center;height:76px;gap:28px}
.logo{display:flex;align-items:center}
.logo svg{height:34px;width:auto}
.nav{display:flex;gap:30px;margin-left:30px;font-size:14px}
.nav span{display:inline-flex;gap:6px;align-items:center}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:20px}
.tpmini{display:flex;align-items:center;gap:8px;font-size:12px}
.stars{display:inline-flex;gap:2px}
.stars i{width:15px;height:15px;background:var(--tp);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:11px;line-height:1}
.stars i:last-child{background:linear-gradient(90deg,var(--tp) 60%,#dcdce6 60%)}
.tp-word{font-weight:700;display:inline-flex;align-items:center;gap:3px}
.tp-word:before{content:"★";color:var(--tp);font-size:15px}
.ico{width:22px;height:22px;display:inline-grid;place-items:center;cursor:pointer;position:relative}
.ico .cnt{position:absolute;top:-6px;right:-8px;background:var(--petrol);color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:16px;height:16px;line-height:16px;text-align:center}
.burger{display:none}

/* hero */
.hero-wrap{padding:0 0 40px;background:var(--sand)}
.hero{display:grid;grid-template-columns:1fr 1.15fr;background:var(--cream);border-radius:0 0 40px 40px;overflow:hidden;min-height:440px;max-width:1320px;margin:0 auto}
.hero-txt{padding:60px 40px 50px 64px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero h1{margin:0;font-size:44px;line-height:1.08;color:var(--purple);font-weight:600}
.hero h1 .serif{display:block;font-size:44px}
.hero p{margin:0;max-width:420px;font-size:15px}
.hero-img{position:relative;overflow:hidden;border-radius:0 0 40px 0;border-top-left-radius:180px}
.hero-img img{width:100%;height:100%;object-fit:cover}
.hero-img .ph{height:100%;border-radius:0}
.hero .btn{align-self:flex-start;min-width:300px}
.hero-badge{position:absolute;top:24px;right:24px;background:var(--red);color:#fff;border-radius:22px;padding:14px 18px;text-align:center;font-weight:700;font-size:28px;line-height:1}
.hero-badge small{display:block;font-size:12px;font-weight:600;margin-top:4px}
.hero.dark{background:var(--petrol);color:#F9F8F7}
.hero.dark h1,.hero.dark h1 .serif{color:#fff}
.hero.dark .btn.ghost{color:#fff}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.hero-btns .btn{min-width:0}
.hero-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;opacity:.9}
.hero-meta span:before{content:"✓ ";font-weight:700}

/* campaign banner (homepage) */
.cbanner{margin:24px auto 0;max-width:1200px;padding:0 40px}
.cb-in{border-radius:28px;background:var(--petrol);color:#F9F8F7;display:grid;grid-template-columns:1.4fr 1fr;gap:28px;padding:34px 40px;align-items:center;position:relative;overflow:hidden}
.cb-in.lilac{background:var(--lilac-soft);color:var(--petrol)}
.cb-in.rose{background:#F9E1E6;color:#5a1830}
.cb-in h2{margin:6px 0 8px;font-size:30px;line-height:1.12;font-weight:600}
.cb-in h2 .serif{font-weight:400}
.cb-in p{margin:0 0 4px;opacity:.9}
.cb-in ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.cb-in li:before{content:"✓";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--lilac);color:var(--purple);font-size:11px;font-weight:800;margin-right:9px}
.cb-side{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.cb-side .btn{width:100%}

/* countdown */
.cd{display:flex;flex-direction:column;gap:6px}
.cd-l{font-size:12px;font-weight:600;letter-spacing:.03em;opacity:.85}
.cd-v{display:flex;gap:6px}
.cd-v span{background:rgba(255,255,255,.12);border-radius:12px;min-width:58px;padding:8px 6px 6px;text-align:center;font-variant-numeric:tabular-nums}
.cd-v b{display:block;font-size:24px;line-height:1;font-weight:700}
.cd-v i{display:block;font-style:normal;font-size:10.5px;opacity:.75;margin-top:3px}
.cd.light .cd-v span{background:#fff;color:var(--petrol)}
.cd.sm .cd-v span{min-width:42px;padding:5px 4px 4px;border-radius:9px}
.cd.sm .cd-v b{font-size:16px}
.cd.sm .cd-v i{font-size:9.5px}
.cd.done .cd-v:after{content:"Afgelopen — banner verdwijnt automatisch";font-size:12px}

/* products */
.sec-pad{padding:64px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pgrid.six{grid-template-columns:repeat(3,1fr)}
.pcard{background:#fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.pcard .pimg{aspect-ratio:1/1;background:#fff;position:relative}
.pcard .pimg img{width:100%;height:100%;object-fit:contain}
.pcard .pb{padding:4px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard h3{margin:0;font-size:20px;line-height:1.2;font-weight:700}
.pcard h3 .serif{font-weight:400;display:block;font-size:17px}
.pcard .d{font-size:13px;opacity:.8;margin:0}
.pcard .chips{display:flex;gap:6px;flex-wrap:wrap}
.pcard .btn{margin-top:auto}
.pbadge{position:absolute;top:14px;right:14px;background:var(--lilac);color:var(--purple);border-radius:16px;padding:8px 12px;font-weight:700;font-size:16px;line-height:1.05;text-align:center;z-index:2}
.pbadge small{display:block;font-size:10.5px;font-weight:600}
.pbadge.red{background:var(--red);color:#fff}
.pbadge.l{left:14px;right:auto}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prow s{opacity:.55;font-size:16px}
.prow strong{font-size:20px}
.stock{font-size:12.5px;display:flex;align-items:center;gap:7px}
.stock:before{content:"";width:9px;height:9px;border-radius:50%;background:#3bb273;box-shadow:0 0 0 4px rgba(59,178,115,.18)}
.stock.warn:before{background:#e0a100;box-shadow:0 0 0 4px rgba(224,161,0,.18)}
.giftline{font-size:12.5px;font-weight:600;color:var(--red)}

.proof{background:var(--sand);padding:26px 0}
.proof .wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center}
.logos{display:flex;gap:18px;flex-wrap:wrap}
.logos span{width:88px;height:26px;border-radius:6px;background:rgba(2,49,48,.08);display:grid;place-items:center;font-size:10px;color:rgba(2,49,48,.45);font-weight:600}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cat{background:var(--sand);border-radius:24px;overflow:hidden}
.cat .ci{aspect-ratio:16/10;background:#e9e4de}
.cat .ci img{width:100%;height:100%;object-fit:cover}
.cat .cb{padding:18px 22px 22px}
.cat h3{margin:0 0 4px;font-size:20px}
.cat .from{font-size:12px;font-weight:600;color:var(--purple)}
.usps{background:var(--cream);border-radius:32px;padding:48px;display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:center}
.usp-list{display:grid;gap:10px}
.usp-list div{background:#fff;border-radius:16px;padding:14px 18px;font-weight:600;display:flex;justify-content:space-between}
.guar{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.guar div{background:var(--sand);border-radius:20px;padding:22px;text-align:center}
.guar b{display:block;font-size:22px;font-family:"Playfair Display",serif;font-style:italic;font-weight:500}
.news{background:var(--petrol);color:#F9F8F7;border-radius:32px;padding:40px;display:flex;gap:30px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.news .f{display:flex;gap:8px;flex:1;min-width:280px;max-width:460px}
.news .f span{flex:1;background:#fff;border-radius:60px;padding:14px 20px;color:#888;font-size:13px}
.ftr{background:var(--surface);border-top:1px solid var(--line);padding:40px 0 30px;margin-top:40px;font-size:13px}
.ftr .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px}
.ftr h5{margin:0 0 8px;font-size:13px}
.ftr p{margin:0;opacity:.75;line-height:1.9}
.pay{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pay span{font-size:9.5px;font-weight:800;padding:5px 7px;border-radius:5px;background:#fff;border:1px solid var(--line);letter-spacing:.02em}
.pay span.k{background:var(--klarna);border-color:var(--klarna)}
.pay span.v{background:#1a1f71;color:#fff;border-color:#1a1f71}
.pay span.a{background:#2e77bb;color:#fff;border-color:#2e77bb}
.pay span.m{background:#111;color:#fff}
.pay span.w{background:#fef08a;border-color:#fef08a}

/* finder */
.finder{background:var(--sand);border-radius:32px;padding:44px}
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.need{background:#fff;border:2px solid transparent;border-radius:20px;padding:18px;text-align:left;color:var(--petrol);display:flex;flex-direction:column;gap:6px}
.need .ni{width:38px;height:38px;border-radius:12px;background:var(--lilac-soft);display:grid;place-items:center;font-size:18px}
.need b{font-size:15px}
.need small{opacity:.7;font-size:12px;line-height:1.35}
.need.on{border-color:var(--petrol);box-shadow:0 6px 18px rgba(2,49,48,.12)}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rec{background:#fff;border-radius:20px;padding:14px;display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center}
.rec img{width:84px;height:84px;object-fit:contain}
.rec b{display:block;font-size:15px}
.rec small{display:block;opacity:.7;font-size:12px}

/* compare */
.cmp{overflow-x:auto;background:#fff;border-radius:24px;padding:8px}
.cmp table{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}
.cmp th,.cmp td{padding:12px 12px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left;font-weight:600;white-space:nowrap}
.cmp thead th{font-size:14px}
.cmp tr:last-child td{border-bottom:0}
.rv{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rv div{background:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.sk{height:9px;border-radius:5px;background:#ebe7e2}
.faq{display:grid;gap:10px}
.faq div{background:#fff;border-radius:16px;padding:16px 20px;font-weight:600;display:flex;justify-content:space-between}
.bundles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.bundle{background:#fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.bundle .ph{aspect-ratio:16/10;border-radius:0}
.bundle .bb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.bundle h3{margin:0;font-size:18px}
.bundle ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
.bundle .btn{margin-top:auto}
.strip{background:var(--petrol);color:#F9F8F7}
.strip .wrap{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;padding-top:14px;padding-bottom:14px;font-size:13.5px}
.strip.warn{background:#fff3d6;color:#5b4200}
.strip b{font-weight:700}
.delivery-card{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.delivery-card > div{background:#fff;border-radius:24px;padding:24px}
.delivery-card h3{margin:6px 0;font-size:19px}

/* PDP */
.pdp{padding:28px 0 40px}
.pdp-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:start}
.gal{position:sticky;top:10px}
.gmain{background:#fff;border-radius:28px;aspect-ratio:1/1;position:relative;overflow:hidden}
.gmain img{width:100%;height:100%;object-fit:contain}
.gmain .ph{height:100%;border-radius:0}
.gthumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.gthumbs > div{aspect-ratio:1/1;background:#fff;border-radius:14px;overflow:hidden;border:2px solid transparent}
.gthumbs > div.on{border-color:var(--petrol)}
.gthumbs img{width:100%;height:100%;object-fit:contain}
.gthumbs .ph{height:100%;font-size:9px;padding:4px;border-radius:0}
.gfree{position:absolute;left:16px;top:16px;width:74px;height:74px;border-radius:50%;background:#1e2a2a;border:3px solid var(--tp);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;text-align:center;line-height:1.2;z-index:2}
.gbadge{position:absolute;right:0;top:0;background:var(--lilac);color:#332A1B;border-radius:0 0 0 24px;padding:12px 18px;text-align:center;font-weight:600;font-size:19px;line-height:1.1;z-index:2}
.gbadge small{display:block;font-size:12px;font-weight:500}
.gbadge.red{background:var(--red);color:#fff}
.info{display:flex;flex-direction:column;gap:14px}
.tprow{display:flex;align-items:center;gap:10px;font-size:13px}
.tprow u{text-underline-offset:3px;font-weight:600}
.ptitle{margin:0;line-height:1.05}
.ptitle .serif{display:block;font-size:34px}
.ptitle .sans{display:block;font-size:36px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.price{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.price s{font-size:20px;opacity:.55}
.price strong{font-size:24px;font-weight:700}
.klarna{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:6px}
.klarna em{font-style:normal;background:var(--klarna);font-weight:800;font-size:10px;padding:1px 6px;border-radius:4px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{display:flex;gap:12px;font-weight:600}
.checks li:before{content:"✓";font-weight:400;font-size:17px;line-height:1.2}
.picker{background:var(--sand);border-radius:22px;padding:18px 22px 22px}
.picker h4{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:10px}
.picker h4 u{font-weight:400;font-style:italic;font-size:14px;text-underline-offset:3px}
.opt{background:#fff;border-radius:18px;padding:14px 18px 14px 50px;position:relative;margin-top:12px;border:1.5px solid transparent}
.opt:before{content:"";position:absolute;left:18px;top:50%;margin-top:-10px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--petrol)}
.opt.on{background:#EBEEEC;border-color:var(--petrol)}
.opt.on:after{content:"";position:absolute;left:23px;top:50%;margin-top:-5px;width:10px;height:10px;border-radius:50%;background:var(--petrol)}
.opt b{display:block;font-weight:500;font-size:15px}
.opt small{font-weight:600;font-size:12.5px}
.opt .pill{position:absolute;right:18px;top:-11px}
.deliv{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px}
.deliv:before{content:"";width:10px;height:10px;border-radius:50%;background:#3bb273;box-shadow:0 0 0 6px rgba(59,178,115,.22)}
.deliv.warn:before{background:#e0a100;box-shadow:0 0 0 6px rgba(224,161,0,.22)}
.tboxes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tboxes div{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:13px;background:#fff}
.tboxes div.full{grid-column:1/-1}
.acc h5{margin:4px 0 10px;text-align:center;font-size:15px;font-weight:500}
.acc h5 b{font-weight:700}
.accg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.accg.three{grid-template-columns:repeat(3,1fr)}
.accg > div{border:1.5px dashed var(--line);border-radius:16px;background:#fff;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600}
.accg .ic{width:46px;height:46px;border-radius:12px;background:var(--sand);display:grid;place-items:center;font-size:20px}
.accg s{font-weight:400;opacity:.6;font-size:12px}
.app{background:var(--petrol);color:#F9F8F7;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;font-size:12px}
.app b{font-size:13px;display:block}
.app .ph{width:54px;height:54px;flex:none;border-radius:12px;font-size:9px;padding:2px}
.pdp-more{padding:10px 0 50px}

/* offer slot (Senior Day / Anniversary component) */
.slot{border-radius:20px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--petrol);color:#F9F8F7}
.slot .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.slot b{display:block;font-size:17px;line-height:1.25;margin:3px 0 2px}
.slot p{margin:0;font-size:12.5px;opacity:.9;line-height:1.4}
.slot.lilac{background:var(--lilac-soft);color:var(--petrol)}
.slot.lilac .cd-v span{background:#fff}
.slot.rose{background:#F9E1E6;color:#5a1830}
.slot.rose .cd-v span{background:#fff}
.slot.red{background:var(--red);color:#fff}
.slot .btn{grid-column:1/-1}
.slot.stack{grid-template-columns:1fr}
.slot .note{grid-column:1/-1;font-size:12px;border-top:1px solid rgba(255,255,255,.2);padding-top:10px;margin-top:2px}
.slot.rose .note,.slot.lilac .note{border-color:rgba(0,0,0,.1)}
.bsel{display:grid;gap:10px}
.bsel .opt small{font-weight:500}
.bsel .opt .add{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-weight:700;font-size:13px}

/* cart */
.cart-wrap{position:relative;min-height:900px;background:var(--surface)}
.cart-bg{position:absolute;inset:0;background:rgba(2,49,48,.35)}
.cart-bg .ghost{position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(0deg,transparent,transparent 120px,rgba(255,255,255,.2) 120px,rgba(255,255,255,.2) 240px)}
.drawer{position:relative;margin-left:auto;width:440px;max-width:100%;background:var(--surface);min-height:900px;box-shadow:-10px 0 40px rgba(0,0,0,.15);display:flex;flex-direction:column}
.dr-h{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 14px;border-bottom:1px solid var(--line)}
.dr-h h3{margin:0;font-size:20px}
.dr-b{padding:16px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
.ship{background:var(--sand);border-radius:14px;padding:10px 14px;font-size:12.5px}
.ship .bar{height:6px;border-radius:3px;background:#fff;margin-top:6px;overflow:hidden}
.ship .bar i{display:block;height:100%;width:100%;background:var(--tp)}
.li{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px}
.li .im{width:76px;height:76px;border-radius:12px;background:var(--sand);overflow:hidden;display:grid;place-items:center;font-size:22px}
.li .im img{width:100%;height:100%;object-fit:contain;background:#fff}
.li b{display:block;font-size:14px;line-height:1.25}
.li small{display:block;opacity:.7;font-size:12px}
.li .pr{text-align:right;font-weight:700;white-space:nowrap}
.li .pr s{display:block;font-weight:400;opacity:.5;font-size:12px}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:30px;margin-top:6px;font-size:12px}
.qty span{padding:2px 9px}
.li.gift{background:#fff;border:1.5px dashed var(--line)}
.sum{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px;font-size:13.5px}
.sum div{display:flex;justify-content:space-between}
.sum .disc{color:var(--red);font-weight:600}
.sum .tot{font-size:17px;font-weight:700;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.cmsg{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4;background:var(--petrol);color:#F9F8F7}
.cmsg b{display:block}
.cmsg.lilac{background:var(--lilac-soft);color:var(--petrol)}
.cmsg.warn{background:#fff3d6;color:#5b4200}
.cmsg.rose{background:#F9E1E6;color:#5a1830}
.mini-trust{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;text-align:center}
.mini-trust span{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 4px}

/* modal */
.modal{position:absolute;inset:0;z-index:60;background:rgba(2,49,48,.55);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.mbox{background:var(--surface);color:var(--petrol);border-radius:28px;width:440px;max-width:100%;padding:30px;position:relative;font-family:Inter,sans-serif;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mbox .x{position:absolute;right:18px;top:14px;border:0;background:none;font-size:22px;color:var(--petrol)}
.mbox h3{margin:6px 0 8px;font-size:26px;line-height:1.15;color:var(--purple)}
.mbox h3 .serif{display:block}
.mbox ul{padding:0;margin:14px 0;list-style:none;display:grid;gap:8px}
.mbox li:before{content:"✓";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--lilac);color:var(--purple);font-size:11px;font-weight:800;margin-right:10px}
.mbox .inp{border:1px solid var(--line);background:#fff;border-radius:60px;padding:15px 20px;color:#999;margin-bottom:10px;font-size:13.5px}
.mbox .fine{font-size:11px;opacity:.65;margin-top:10px;line-height:1.4}
.mbox .tag{position:absolute;left:30px;top:-12px}
.succ{text-align:center;padding:20px 0}
.succ .ok{width:64px;height:64px;border-radius:50%;background:var(--lilac);color:var(--purple);display:grid;place-items:center;font-size:30px;margin:0 auto 12px}

/* LP */
.lp-hero{background:var(--petrol);color:#F9F8F7;padding:0}
.lp-hero .in{display:grid;grid-template-columns:1.1fr 1fr;min-height:480px}
.lp-hero .tx{padding:56px 40px 56px 64px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.lp-hero h1{margin:0;font-size:52px;line-height:1.02;font-weight:700}
.lp-hero h1 .serif{display:block;font-weight:400;font-size:44px}
.lp-hero .im{position:relative;background:#fff;border-top-left-radius:200px;overflow:hidden}
.lp-hero .im img{width:100%;height:100%;object-fit:contain;padding:30px}
.lp-hero .im .ph{height:100%;border-radius:0}
.lp-hero.rose{background:#5a1830}
.lp-hero.rose .im{background:#F9E1E6}
.sticky-cta{position:sticky;bottom:0;z-index:20;background:rgba(249,248,247,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:none;gap:10px;align-items:center}
.sticky-cta .btn{flex:1;padding:14px}
.sticky-cta small{font-size:11.5px;line-height:1.25}

/* ============ Mobile layout (container query) ============ */
@container site (max-width: 760px){
  .wrap{padding:0 16px}
  .nav,.tpmini,.hdr-r .tpmini{display:none}
  .burger{display:inline-grid}
  .hdr .wrap{height:64px;gap:14px}
  .logo{margin:0 auto}
  .logo svg{height:30px}
  .hdr-r{margin-left:0;gap:14px}
  .ann{font-size:12.5px;padding:8px 12px}
  .ann b{display:block;margin:0}
  .ann .serif{font-size:13.5px}
  .hero{grid-template-columns:1fr;border-radius:0 0 28px 28px;min-height:0}
  .hero-txt{padding:30px 20px 26px;order:2}
  .hero-img{order:1;height:260px;border-radius:0;border-top-left-radius:0}
  .hero h1,.hero h1 .serif{font-size:32px}
  .hero .btn{min-width:0;align-self:stretch}
  .hero-btns .btn{flex:1}
  .cbanner{padding:0 16px;margin-top:16px}
  .cb-in{grid-template-columns:1fr;padding:24px 20px;gap:18px;border-radius:24px}
  .cb-in h2{font-size:24px}
  .cd-v span{min-width:0;flex:1}
  .cd-v b{font-size:20px}
  .sec-pad{padding:40px 0}
  .h2{font-size:26px}
  .sec-head{flex-direction:column;align-items:flex-start}
  .pgrid,.pgrid.six,.catgrid,.guar,.rv,.bundles,.recs,.delivery-card{grid-template-columns:1fr}
  .pgrid{gap:14px}
  .needs{grid-template-columns:1fr 1fr}
  .finder{padding:26px 16px;border-radius:24px}
  .usps{grid-template-columns:1fr;padding:28px 20px;border-radius:24px}
  .news{padding:26px 20px;border-radius:24px}
  .news .f{min-width:0}
  .ftr .cols{grid-template-columns:1fr 1fr}
  .pdp{padding:0 0 30px}
  .pdp .wrap{padding:0}
  .pdp-grid{grid-template-columns:1fr;gap:18px}
  .gal{position:relative;top:0}
  .gmain{border-radius:0 0 28px 28px}
  .gthumbs{padding:0 16px;grid-template-columns:repeat(5,1fr);gap:6px}
  .info{padding:0 16px}
  .ptitle .serif{font-size:30px}.ptitle .sans{font-size:32px}
  .slot{grid-template-columns:1fr}
  .lp-hero .in{grid-template-columns:1fr}
  .lp-hero .tx{padding:30px 20px;order:2}
  .lp-hero .im{height:260px;border-top-left-radius:0;order:1}
  .lp-hero h1{font-size:36px}.lp-hero h1 .serif{font-size:30px}
  .sticky-cta{display:flex}
  .drawer{width:100%}
  .accg.three{grid-template-columns:repeat(3,1fr)}
  .proof .wrap{gap:14px}
}
</style>
</head>
<body>
<div id="app">
  <div class="pt-bar">
    <div class="pt-row">
      <div class="pt-title"><span class="pt-dot"></span>Dreaver campaigns <small>prototype · NL</small></div>
      <div class="seg" id="pages"></div>
      <select class="pt-sel" id="product" title="Product (PDP + cart)"></select>
      <div class="seg" id="vipseg" title="VIP early access: who is viewing?"></div>
      <div class="pt-spacer"></div>
      <div class="seg" id="view"></div>
      <div class="seg" id="device"></div>
      <label class="tgl"><input type="checkbox" id="marks" checked><i></i>Annotations</label>
      <label class="tgl" title="Fade sections that do not change"><input type="checkbox" id="dim"><i></i>Dim rest</label>
      <label class="tgl"><input type="checkbox" id="panelTgl" checked><i></i>Panel</label>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
  <div class="pt-main">
    <div class="pt-stagewrap">
      <div class="pt-stage" id="stage"><div class="site" id="site"></div></div>
      <div class="modal" id="modal"></div>
    </div>
    <aside class="pt-panel" id="panel"></aside>
  </div>
</div>

const PAGES = [['home','Homepage'],['pdp','Product page'],['cart','Cart'],['lp','Landing page']];

/* ================= STATE ================= */
const S = {c:'baseline', page:'home', product:'assist', device:'desktop', marks:true, dim:false, vip:'vip', base:false, need:'walk', gift:'thuis', bundle:0, simOffset:0, modal:null};
const camp = () => CAMPAIGNS.find(x => x.id === S.c);
const C = () => S.base ? CAMPAIGNS[0] : camp();
const is = (...ids) => ids.includes(C().id);
const now = () => Date.now() + S.simOffset;
const mk = (id, t) => ` data-chg="${id}" data-t="${t || typeOf(id)}"`;
function typeOf(id){ const c = C(); if (c.ann && c.ann.id === id) return c.ann.t; for (const k in c.changes) { const f = (c.changes[k]||[]).find(x => x.id === id); if (f) return f.t; } return 'new'; }
const img = (k, alt='') => `<img src="${IMG[k]}" alt="${alt}" loading="lazy" onerror="this.classList.add('broken')">`;
const eur = n => n.toLocaleString('nl-NL') + ',-';
const stars = () => `<span class="stars">${'<i>★</i>'.repeat(5)}</span>`;
const cd = (to, label, cls='') => `<div class="cd ${cls}" data-to="${to}"><span class="cd-l">${label}</span><span class="cd-v"></span></div>`;
const cdi = (to) => `<span class="cdi" data-to="${to}" data-inline="1"></span>`;
const ICON = {
  search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
  bag:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16l-1.5 12h-13z"/><path d="M8 8a4 4 0 0 1 8 0"/></svg>',
  burger:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>',
  chev:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>'
};

function annBar(){
  const c = C(); const id = c.ann ? mk('ann') : '';
  let h = `<b>NATIONALE VITALITEITSWEEK 💚</b><span class="serif">Nu tot €200 korting + <b style="margin:0">gratis</b> accessoires</span>`;
  if (is('vip-count')) h = `<b>VIP EARLY ACCESS</b><span class="serif">opent over</span>${cdi(c.to)}<span class="serif">· <u>Meld je nu aan</u> en shop als eerste</span>`;
  if (is('vip-live')) h = S.vip === 'vip'
    ? `<b>VIP EARLY ACCESS IS LIVE</b><span class="serif">Gratis giftbox bij je loopband · VIP-venster sluit over</span>${cdi(c.to)}`
    : `<b>BLACK FRIDAY START VANDAAG</b><span class="serif">Publieke deals vanaf 15:00 · nog</span>${cdi(c.to)}`;
  if (is('bfcm')) h = `<b>BLACK FRIDAY</b><span class="serif">Tot ${tbc('XX%')} korting + gratis cadeau t.w.v. ${tbc('€XX')} · t/m 1 december</span>`;
  if (is('xmas')) h = `<b>KERST 🎄</b><span class="serif">Bestel vóór ${tbc('18 december','conservative cutoff per market')} voor levering vóór Kerst · Gratis bezorgd</span>`;
  if (is('xmas-post')) h = `<b>LEVERING NA KERST</b><span class="serif">Bestel je nu? Dan leveren we vanaf ${tbc('27 december')} · 30 dagen proeflopen</span>`;
  if (is('anniv')) h = `<b>6 JAAR DREAVER</b><span class="serif">Extra ${tbc('€60','calendar amount is an example')} korting op je loopband · t/m 27 januari</span>`;
  if (is('val-gift')) h = `<b>VALENTIJN ♥</b><span class="serif">Geef beweging cadeau · bestel vóór ${tbc('11 februari')} voor levering vóór 14/2 · <u>Bekijk cadeaus</u></span>`;
  if (is('val-flash')) h = `<b>VALENTIJNS FLASH SALE</b><span class="serif">${tbc('XX%')} korting · eindigt over</span>${cdi(c.to)}`;
  return `<div class="ann sec"${id}>${h}</div>`;
}

const $ = s => document.querySelector(s);
const fmtSim = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, weekday:'short', day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', timeZoneName:'short'});

function setCampaign(id, keepPage){
  S.c = id; S.base = false;
  const c = camp(); S.simOffset = Date.parse(c.sim) - Date.now();
  if (!keepPage && S.page === 'lp' && !c.changes.lp) S.page = 'home';
  if (!keepPage) {
    // jump to the most relevant page for this campaign
    const firstWith = ['home','pdp','cart','lp'].find(p => (c.changes[p]||[]).length);
    if (firstWith && !(c.changes[S.page]||[]).length && !(c.ann)) S.page = firstWith;
  }
  render();
}
function renderToolbar(){
  $('#pages').innerHTML = PAGES.map(([k,l]) => { const dis = k === 'lp' && !camp().changes.lp; return `<button class="${S.page===k?'on':''}" data-page="${k}" ${dis?'disabled title="No landing page in this campaign"':''}>${l}</button>`; }).join('');
  $('#product').innerHTML = PDP_PRODUCTS.map(k => `<option value="${k}" ${S.product===k?'selected':''}>${P[k].name}${camp().eligible && !camp().eligible.includes(k) ? ' (not eligible)' : ''}</option>`).join('');
  $('#product').style.display = (S.page === 'pdp' || S.page === 'cart') ? '' : 'none';
  const vs = $('#vipseg'); vs.style.display = camp().vipToggle ? '' : 'none';
  vs.innerHTML = `<button class="${S.vip==='vip'?'on':''}" data-vip="vip">VIP visitor</button><button class="${S.vip==='pub'?'on':''}" data-vip="pub">Non-VIP visitor</button>`;
  $('#view').innerHTML = `<button class="${!S.base?'on':''}" data-base="0">Campaign</button><button class="${S.base?'on':''}" data-base="1" ${S.c==='baseline'?'disabled':''}>Before (live)</button>`;
  $('#device').innerHTML = `<button class="${S.device==='desktop'?'on':''}" data-dev="desktop">Desktop</button><button class="${S.device==='mobile'?'on':''}" data-dev="mobile">Mobile</button>`;
  let lastM = '';
  $('#timeline').innerHTML = CAMPAIGNS.map(c => { let m = ''; if (c.month !== lastM) { m = `<span class="tl-month">${c.month}</span>`; lastM = c.month; }
    return `${m}<button class="tl ${c.ab?'ab':''} ${S.c===c.id?'on':''}" data-c="${c.id}">${c.tag ? `<em>${c.tag}</em>` : ''}<b>${c.short}</b><span>${c.dates.replace(/ 202[67]/g,'')}</span></button>`; }).join('');
}
function render(){
  renderToolbar();
  const st = $('#stage'), site = $('#site');
  const sc = st.scrollTop;
  st.classList.toggle('stage-mobile', S.device === 'mobile');
  site.classList.toggle('marks', S.marks && !S.base);
  site.classList.toggle('dim', S.dim && !S.base);
  let h = S.base ? `<div class="basebadge">BEFORE — live site today (no campaign changes)</div>` : '';
  h += ({home:pageHome, pdp:pagePdp, cart:pageCart, lp:pageLp})[S.page]();
  site.innerHTML = h;
  st.scrollTop = sc;
  numberMarks();
  renderPanel();
  tick();
  writeHash();
}
function pageItems(page){
  const c = C(); const list = [...(c.changes[page] || [])];
  if (c.ann && page !== 'lp-none') list.unshift(c.ann);
  return list;
}
function orderedItems(){
  const items = pageItems(S.page); const el = id => document.querySelector(`#site [data-chg="${id}"]`);
  return items.map((it, i) => ({it, i, e: el(it.id)})).sort((a, b) => {
    if (!a.e || !b.e) return (!a.e) - (!b.e) || a.i - b.i;
    return a.e === b.e ? a.i - b.i : (a.e.compareDocumentPosition(b.e) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1);
  }).map(x => x.it);
}
function numberMarks(){
  document.querySelectorAll('#site [data-n]').forEach(e => e.removeAttribute('data-n'));
  orderedItems().forEach((it, i) => { const el = document.querySelector(`#site [data-chg="${it.id}"]`); if (el) el.setAttribute('data-n', i + 1); });
}
function renderPanel(){
  const c = camp(); const items = orderedItems();
  const pages = PAGES.filter(([k]) => k !== 'lp' || c.changes.lp).map(([k,l]) => { const n = pageItems(k).length; return `<button class="${S.page===k?'on':''} ${n?'':'zero'}" data-page="${k}">${l} · ${n}</button>`; }).join('');
  let list;
  if (c.ab) list = `<div class="pp-note"><b>No campaign build in this period.</b><br>${c.goal}<br><br>Tests, briefs and priorities live in the CRO roadmap. Keep planned tests off pages that campaign components change, and preserve a clear purchase experience when both run together.</div>`;
  else if (c.id === 'baseline') list = `<div class="pp-empty">This is the live site as of today. Pick a campaign in the timeline above to see what changes. Use <b>Before (live)</b> inside any campaign to flip back to this view.</div>`;
  else if (!items.length) list = `<div class="pp-empty">No changes on this page for ${c.name}. ${pages ? 'See the other pages below.' : ''}</div>`;
  else list = `<ul class="chlist">${items.map((it, i) => { const found = document.querySelector(`#site [data-chg="${it.id}"]`); return `<li class="chitem ${found || S.base ? '' : 'missing'}" data-jump="${it.id}"><span class="n t-${it.t}">${i+1}</span><span class="ty c-${it.t}">${({new:'New',changed:'Changed',qa:'QA / verify',opt:'Optional'})[it.t]}</span><b>${it.title}</b><p>${it.desc}</p></li>`; }).join('')}</ul>`;
  $('#panel').innerHTML = `
    <div class="pp-kicker">${c.ab ? 'A/B testing period' : c.id === 'baseline' ? 'Reference' : 'Campaign'}</div>
    <div class="pp-h">${c.name}</div><div class="pp-dates">${c.dates}</div>
    <div class="pp-clock">🕒 <span>Simulated time</span> <b id="simclock"></b></div>
    ${S.base ? `<div class="pp-note">Showing the <b>live site</b> for comparison. Switch back to <b>Campaign</b> to see the changes.</div>` : ''}
    <div class="pp-block"><h4>Main goal</h4><p>${c.goal}</p></div>
    ${c.deliverable !== '—' ? `<div class="pp-block"><h4>Deliverable</h4><p>${c.deliverable}</p></div>` : ''}
    ${!c.ab && c.id !== 'baseline' ? `<div class="pp-block"><h4>Changes per page</h4><div class="pp-pages">${pages}</div></div>` : ''}
    <div class="pp-block"><h4>${c.ab || c.id === 'baseline' ? 'Notes' : 'On this page'}</h4>
      ${!c.ab && c.id !== 'baseline' ? `<div class="legend"><span><i class="t-new"></i>New</span><span><i class="t-changed"></i>Changed</span><span><i class="t-qa"></i>QA / verify</span><span><i class="t-opt"></i>Optional</span></div>` : ''}
      ${list}</div>
    ${c.eligible ? `<div class="pp-block"><h4>Eligibility</h4><p>Only shown on the ${c.eligible.map(k => P[k].name).join(', ')} PDP. Switch product in the toolbar to check other PDPs stay clean.</p></div>` : ''}
    ${c.vipToggle ? `<div class="pp-block"><h4>Audience</h4><p>Use the <b>VIP / Non-VIP visitor</b> switch in the toolbar. At 15:00 everything switches to the public BFCM experience and VIP-only messaging is removed.</p></div>` : ''}
    ${c.tbc.length ? `<div class="pp-block"><h4>To confirm before build</h4><ul class="tbc-list">${c.tbc.map(t => `<li>${t}</li>`).join('')}</ul><p style="font-size:12px;color:var(--ui-mute);margin-top:6px"><span class="tbc" style="font-size:12px">Highlighted values</span> in the page are placeholders until the offer is confirmed. Hover them for context.</p></div>` : ''}
    <div class="pp-block"><h4>Always</h4><p style="font-size:12.5px;color:#555">Localise copy, currency and delivery info for NL, DK and SE. Countdowns use Europe/Amsterdam time, reflect the real event and expire automatically. Check mobile + desktop.</p></div>
    <div class="kbd"><kbd>←</kbd> <kbd>→</kbd> switch campaign · <kbd>B</kbd> before/after · <kbd>1</kbd>–<kbd>4</kbd> pages · <kbd>M</kbd> mobile</div>`;
}
function pad(n){ return String(n).padStart(2,'0'); }
function tick(){
  const t = now();
  const sc = document.getElementById('simclock'); if (sc) sc.textContent = fmtSim.format(t);
  document.querySelectorAll('#site [data-to]').forEach(el => {
    let d = Math.max(0, Date.parse(el.dataset.to) - t);
    const D = Math.floor(d/864e5), H = Math.floor(d/36e5)%24, M = Math.floor(d/6e4)%60, Sx = Math.floor(d/1e3)%60;
    if (el.dataset.inline) { el.textContent = (D ? D + 'd ' : '') + pad(H) + 'u ' + pad(M) + 'm ' + pad(Sx) + 's'; return; }
    el.classList.toggle('done', d === 0);
    const v = el.querySelector('.cd-v');
    const parts = (D ? [[D,'dagen']] : []).concat([[H,'uur'],[M,'min'],[Sx,'sec']]);
    v.innerHTML = d === 0 ? '' : parts.map(([n,l]) => `<span><b>${pad(n)}</b><i>${l}</i></span>`).join('');
  });
}
setInterval(tick, 1000);

function writeHash(){ history.replaceState(null, '', `#c=${S.c}&p=${S.page}&prod=${S.product}&d=${S.device}${S.vip==='pub'?'&v=pub':''}`); }
function readHash(){
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('c') && CAMPAIGNS.find(c => c.id === q.get('c'))) S.c = q.get('c');
  if (q.get('p')) S.page = q.get('p');
  if (q.get('prod') && P[q.get('prod')]) S.product = q.get('prod');
  if (q.get('d')) S.device = q.get('d');
  if (q.get('v') === 'pub') S.vip = 'pub';
  S.simOffset = Date.parse(camp().sim) - Date.now();
}
function openModal(step){ const m = $('#modal'); m.innerHTML = modalHtml(step); m.classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-c],[data-page],[data-vip],[data-base],[data-dev],[data-jump],[data-go],[data-need],[data-gift],[data-bundle],[data-modal],[data-close],[data-vipok],[data-scroll],#site [data-n]');
  if (!t) return;
  const d = t.dataset;
  if (d.c) return setCampaign(d.c);
  if (d.page) { if (d.page === 'lp' && !camp().changes.lp) return; S.page = d.page; $('#stage').scrollTop = 0; return render(); }
  if (d.vip) { S.vip = d.vip; return render(); }
  if (d.base) { S.base = d.base === '1'; return render(); }
  if (d.dev) { S.device = d.dev; return render(); }
  if (d.need) { S.need = d.need; return render(); }
  if (d.gift) { S.gift = d.gift; return render(); }
  if (d.bundle) { S.bundle = +d.bundle; return render(); }
  if (d.modal !== undefined) { e.preventDefault(); return openModal('form'); }
  if (d.vipok !== undefined) return openModal('ok');
  if (d.close !== undefined) return closeModal();
  if (d.jump) { const el = document.querySelector(`#site [data-chg="${d.jump}"]`); if (el) { el.scrollIntoView({block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } return; }
  if (d.go) { e.preventDefault(); if (d.go === 'lp' && !camp().changes.lp) return; if (d.p) S.product = PDP_PRODUCTS.includes(d.p) ? d.p : S.product; S.page = d.go; $('#stage').scrollTop = 0; render();
    if (d.scroll) setTimeout(() => { const x = document.getElementById(d.scroll); if (x) x.scrollIntoView({block:'start'}); }, 50); return; }
  if (d.scroll) { const x = document.getElementById(d.scroll); if (x) x.scrollIntoView({block:'start'}); return; }
  if (d.n) { const it = orderedItems()[+d.n - 1]; const li = it && document.querySelector(`.chitem[data-jump="${it.id}"]`); if (li) { document.querySelectorAll('.chitem.hl').forEach(x => x.classList.remove('hl')); li.classList.add('hl'); li.scrollIntoView({block:'nearest', behavior:'smooth'}); } }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#product').addEventListener('change', e => { S.product = e.target.value; render(); });
$('#marks').addEventListener('change', e => { S.marks = e.target.checked; render(); });
$('#dim').addEventListener('change', e => { S.dim = e.target.checked; render(); });
$('#panelTgl').addEventListener('change', e => { $('#panel').classList.toggle('hide', !e.target.checked); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  const i = CAMPAIGNS.findIndex(c => c.id === S.c);
  if (e.key === 'ArrowRight' && i < CAMPAIGNS.length - 1) setCampaign(CAMPAIGNS[i+1].id);
  else if (e.key === 'ArrowLeft' && i > 0) setCampaign(CAMPAIGNS[i-1].id);
  else if (e.key.toLowerCase() === 'b' && S.c !== 'baseline') { S.base = !S.base; render(); }
  else if (e.key.toLowerCase() === 'm') { S.device = S.device === 'mobile' ? 'desktop' : 'mobile'; render(); }
  else if (['1','2','3','4'].includes(e.key)) { const pg = PAGES[+e.key - 1][0]; if (pg !== 'lp' || camp().changes.lp) { S.page = pg; $('#stage').scrollTop = 0; render(); } }
  else if (e.key === 'Escape') closeModal();
  else return;
  const on = document.querySelector('.tl.on'); if (on) on.scrollIntoView({inline:'nearest', block:'nearest'});
});
readHash(); render();

</script>
</body>
</html>
