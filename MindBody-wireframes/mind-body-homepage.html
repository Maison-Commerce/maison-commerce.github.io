function dialog(title,body){const before=document.activeElement;const overlay=document.createElement('div');overlay.className='zoom';overlay.innerHTML=`<div class="zoom-panel" role="dialog" aria-modal="true" aria-label="${title}"><button>${t('Sluiten','Close')} ×</button><h2>${title}</h2><div>${body}</div></div>`;document.body.append(overlay);const close=()=>{overlay.remove();document.body.style.overflow='';before?.focus();};overlay.querySelector('button').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close();};overlay.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();overlay.querySelector('button').focus();}};document.body.style.overflow='hidden';overlay.querySelector('button').focus();}
