function calc(cart=state.cart){const units=[];let subtotal=0;for(const p of products){for(let i=0;i<(cart[p.id]||0);i++){subtotal+=p.price;if(p.eligible)units.push({id:p.id,price:p.price});}}units.sort((a,b)=>a.price-b.price);const freeCount=Math.floor(units.length/3);const freeUnits=units.slice(0,freeCount);const bogo=freeUnits.reduce((s,u)=>s+u.price,0);const active=bogo>0?'bogo':'none';const saving=bogo;const free={};freeUnits.forEach(u=>free[u.id]=(free[u.id]||0)+1);return {subtotal,n:units.length,freeCount,bogo,active,saving,total:subtotal-saving,free};}

function notesPanel(){let ids=state.page==='home'?['01','02','10']:state.page==='collection'?['01','03','10']:state.page==='product'?['04','08','01','10']:['05','06','07','10'];return `<aside class="aside"><div class="aside-title"><div class="eyebrow">${tr('Review layer','Reviewlaag')}</div><h2 style="margin-top:8px">${tr('What changed','Wat is gewijzigd')}</h2><p>${tr('Numbered markers identify proposed changes.','Genummerde labels tonen de voorgestelde wijzigingen.')}</p></div>${ids.map(id=>{const [title,before,after]=notes[id]();return `<article class="note" id="note-${id}"><div class="note-num">${id} / ${tr('PROPOSED CHANGE','VOORGESTELDE WIJZIGING')}</div><h3>${title}</h3><p><b>${tr('Observed:','Huidig:')}</b> ${before}</p><p><b>${tr('Proposed:','Voorstel:')}</b> ${after}</p></article>`}).join('')}<div class="assumptions"><b>${tr('Prototype assumptions','Aannames in de demo')}</b><br>${tr('Sample prices from the review. All six sample kits qualify. One lowest-priced unit free per three eligible units. Existing storage bag and mini-kit gifts are retained and do not count toward 2+1. The demo starts with one owl kit. Countdown values are a visual example. Final eligibility, repetition and dates require approval.','Voorbeeldprijzen uit de review. Alle zes voorbeeldpakketten doen mee. Eén goedkoopste pakket gratis per drie deelnemende pakketten. De bestaande opbergtas en het mini-pakket blijven behouden en tellen niet mee voor 2+1. De demo begint met één uilenpakket. De timerwaarden zijn een visueel voorbeeld. Deelname, herhaling en datums vereisen goedkeuring.')}</div></aside>`}
function toolbar(){return `<header class="shell-head"><div><div class="eyebrow">Bouwpakket.com / CRO</div><h1>${tr('Holiday sale · Interactive wireframe','Feestdagenactie · Interactief wireframe')}</h1><p>${tr('Explore the proposed shopping journey. Numbered notes explain each addition.','Bekijk de voorgestelde winkelervaring. Genummerde notities leggen elke toevoeging uit.')}</p></div><span class="version">${tr('DESIGN REVIEW · V4','DESIGNREVIEW · V4')}</span></header><section class="controls" aria-label="${tr('Prototype controls','Prototypebediening')}"><div><span class="control-label">${tr('Screen','Scherm')}</span><div class="seg screen-seg">${Object.keys(t).map((k,i)=>`<button data-act="page" data-id="${k}" aria-pressed="${state.page===k}" class="${state.page===k?'active':''}">${i+1}. ${txt(k)}</button>`).join('')}</div></div><div class="row"><div><label class="control-label" for="phase">${tr('Campaign phase','Campagnefase')}</label><select id="phase"><option value="bf" ${state.phase==='bf'?'selected':''}>Black Friday</option><option value="cm" ${state.phase==='cm'?'selected':''}>Cyber Monday</option><option value="year" ${state.phase==='year'?'selected':''}>${tr('End-of-year sale','Eindejaarssale')}</option></select></div><div><span class="control-label">${tr('Preview','Voorbeeld')}</span><div class="seg"><button data-act="device" data-id="desktop" class="${!state.mobile?'active':''}" aria-pressed="${!state.mobile}">${tr('Desktop','Desktop')}</button><button data-act="device" data-id="mobile" class="${state.mobile?'active':''}" aria-pressed="${state.mobile}">${tr('Mobile','Mobiel')}</button></div></div><div><span class="control-label">${tr('Language','Taal')}</span><div class="seg"><button data-act="lang" data-id="en" aria-pressed="${state.lang==='en'}" class="${state.lang==='en'?'active':''}">EN</button><button data-act="lang" data-id="nl" aria-pressed="${state.lang==='nl'}" class="${state.lang==='nl'?'active':''}">NL</button></div></div></div></section><div function countdown(){const parts=[['02',tr('Days','Dagen')],['14',tr('Hours','Uur')],['35',tr('Min','Min')],['08',tr('Sec','Sec')]];return `<div class="campaign-countdown" role="img" aria-label="${tr('Sample countdown: 2 days, 14 hours, 35 minutes, 8 seconds. Final deadline to be set.','Voorbeeldtimer: 2 dagen, 14 uur, 35 minuten, 8 seconden. Definitieve deadline volgt.')}"><span class="countdown-lead">${tr('Ends in','Nog')}</span><div class="countdown-digits">${parts.map(([value,label],i)=>`${i?'<span class="countdown-colon" aria-hidden="true">:</span>':''}<div class="countdown-unit"><b>${value}</b><span>${label}</span></div>`).join('')}</div></div>`}

function collection(){let list=products.filter(p=>state.category==='all'||p.cat===state.category);if(state.sort==='asc')list.sort((a,b)=>a.price-b.price);if(state.sort==='desc')list.sort((a,b)=>b.price-a.price);return `<div class="page"><div class="crumb">Home / ${tr('Holiday favorites','Feestdagenfavorieten')}</div><section class="compact-banner">${tag('03',tr('Compact banner + eligibility','Compacte banner + deelname'))}<div class="eyebrow">${phase()}</div><h1>${tr('Mix your favorites.<br>Choose 3, pay for 2.','Combineer je favorieten.<br>3 kiezen, 2 betalen.')}</h1><p>${tr('Choose any 3 eligible kits and add all 3 to your basket. The cheapest becomes free automatically. No code needed.','Kies 3 deelnemende bouwpakketten en voeg alle 3 toe aan je winkelwagen. Het goedkoopste wordt automatisch gratis. Geen code nodig.')}</p><button class="text-btn" style="justify-self:start" data-act="grid">${tr('Explore eligible kits','Bekijk deelnemende pakketten')} ↓</button></section><div class="filters" id="product-grid"><div class="row">${[['all',tr('All kits','Alle pakketten')],['animals',tr('Animals','Dieren')],['vehicles',tr('Vehicles & ships','Voertuigen & schepen')]].map(([id,label])=>`<button data-act="category" data-id="${id}" class="${state.category===id?'active':''}" aria-pressed="${state.category===id}">${label}</button>`).join('')}</div><select id="sort" aria-label="${tr('Sort products','Sorteer producten')}"><option value="featured" ${state.sort==='featured'?'selected':''}>${tr('Featured','Uitgelicht')}</option><option value="asc" ${state.sort==='asc'?'selected':''}>${tr('Price: low to high','Prijs: laag naar hoog')}</option><option value="desc" ${state.sort==='desc'?'selected':''}>${tr('Price: high to low','Prijs: hoog naar laag')}</option></select></div><p class="small muted" style="margin-bottom:14px">${list.length} ${tr('eligible kits','deelnemende bouwpakketten')}</p>${cards(list)}</div>`}
function gifts(){return `<section class="gifts"><h3>${tr('Your FREE gifts (worth €40)','Jouw GRATIS cadeaus (t.w.v. €40)')}</h3><div class="gift-grid">${[[tr('Storage bag','Opbergtas'),'bag'],[tr('Mini building kit','Mini bouwpakket'),'kit']].map(([label,kind])=>`<div class="gift-card"><span class="pill">${tr('FREE','GRATIS')}</span><div class="gift-visual ${kind}" aria-hidden="true">${kind==='bag'?'▱':'▦'}</div><b>${label}</b><span><del class="ref-price">${money(2000)}</del><strong>${money(0)}</strong></span></div>`).join('')}</div></section>`}
function quickAdd(p){const c=calc();const choices=products.filter(x=>x.id!==p.id&&x.eligible).sort((a,b)=>(b.cat===p.cat)-(a.cat===p.cat)).slice(0,2);const remaining=3-(c.n%3);return `<section class="pdp-quick-add">${tag('08',tr('New · quick add','Nieuw · snel toevoegen'))}<h3>${tr('Complete your 2+1 selection','Maak je 2+1-selectie compleet')}</h3><p class="small muted">${c.n===0?tr('Choose your first kit above, then add your favorites here.','Kies hierboven je eerste pakket en voeg hier je favorieten toe.'):c.n%3===0?tr(`${c.freeCount} free ${c.freeCount===1?'kit':'kits'} unlocked in your basket.`,`${c.freeCount} ${c.freeCount===1?'gratis pakket':'gratis pakketten'} geactiveerd in je winkelwagen.`):tr(`${remaining} more ${remaining===1?'kit':'kits'} to your next free kit.`, `Nog ${remaining} ${remaining===1?'pakket':'pakketten'} tot je volgende gratis pakket.`)}</p>${choices.map(x=>`<div class="rec">${art(x,true)}<div><b>${name(x)}</b><p>${money(x.price)} · ${tr('Eligible for 2+1','Doet mee aan 2+1')}</p>${state.cart[x.id]?`<p class="added-label">✓ ${state.cart[x.id]} ${tr('in basket','in winkelwagen')}</p>`:''}</div><button data-act="pdp-quick-add" data-id="${x.id}" aria-label="${tr('Add','Voeg toe')} ${name(x)}">+ ${tr('Add','Voeg toe')}</button></div>`).join('')}<div class="row between" style="margin-top:12px"><span class="small">${tr('Cheapest eligible kit free.','Goedkoopste deelnemende pakket gratis.')}</span><button class="text-btn" data-act="drawer">${tr('View basket','Bekijk winkelwagen')} (${c.n}) →</button></div></section>`}
function pdp(){const p=product(state.product);return `<div class="page"><div class="crumb"><button class="text-btn small" data-act="page" data-id="collection">${tr('Collection','Collectie')}</button> / ${name(p)}</div><div class="pdp"><div><div class="pdp-art">${art(p)}<div class="thumbs" aria-label="${tr('Gallery wireframe','Galerijwireframe')}"><span></span><span></span><span></span><span></span></div></div><p class="small muted" style="margin-top:10px">${tr('Wireframe image placeholders · final photography retained','Wireframe-afbeeldingen · definitieve productfotografie behouden')}</p></div><div class="stack"><div><div class="eyebrow">${tr('Building kit','Bouwpakket')}</div><h1 style="margin:10px 0">${name(p)}</h1><p class="intro">${tr('An absorbing building project, a little time for yourself, and a model to be proud of.','Een boeiend bouwproject, een moment voor jezelf en een model om trots op te zijn.')}</p></div><div><span class="price">${p.reference?`<del class="ref-price">${money(p.reference)}</del>`:''}${money(p.price)}</span><p class="small muted">${tr('Current selling price · before holiday discount','Huidige verkoopprijs · vóór feestdagenkorting')}</p></div>${p.pieces?`<div class="meta"><span>12+</span><span>${p.pieces} ${tr('pieces','steentjes')}</span><span>${p.hours} ${tr('hours','uur')}</span></div>`:''}<div class="offer-card">${tag('04',tr('New buy-box offer','Nieuwe actie bij koopknop'))}<h3>${tr('2+1 FREE — mix your favorites','2+1 GRATIS — combineer je favorieten')}</h3><p>${tr('Add 3 eligible kits to your basket. The cheapest is automatically free.','Voeg 3 deelnemende bouwpakketten toe aan je winkelwagen. Het goedkoopste is automatisch gratis.')}</p><div class="offer-alt"><p><b>${tr('No code needed.','Geen code nodig.')}</b> ${tr('Mix different kits or choose more than one of the same. Add all three to unlock the offer.','Combineer verschillende pakketten of kies meerdere van hetzelfde. Voeg alle drie toe om de actie te activeren.')}</p></div></div><div class="buy-row"><div class="qty"><button data-act="pqty" data-delta="-1" aria-label="${tr('Decrease quantity','Aantal verlagen')}" ${state.qty<=1?'disabled':''}>−</button><span>${state.qty}</span><button data-act="pqty" data-delta="1" aria-label="${tr('Increase quantity','Aantal verhogen')}">+</button></div><button class="primary" data-act="add-product">${tr('Add to basket','Voeg toe aan winkelwagen')} →</button></div>${quickAdd(p)}${gifts()}<div class="benefit">✓ ${tr('Free delivery in the Netherlands and Belgium','Gratis bezorging in Nederland en België')}<br><span class="small muted">${tr('Instructions included · 60-day returns','Inclusief handleiding · 60 dagen retourneren')}</span></div><details class="detail"><summary>${tr('How does the offer work?','Hoe werkt de actie?')}</summary><p>${tr('Choose 3 eligible kits and add all 3 to your basket. The cheapest is free automatically. You can mix different kits or choose multiple units of the same kit. With fewer than 3 eligible kits, the current selling prices apply.','Kies 3 deelnemende pakketten en voeg alle 3 toe aan je winkelwagen. Het goedkoopste wordt automatisch gratis. Je kunt verschillende pakketten combineren of meerdere van hetzelfde kiezen. Bij minder dan 3 deelnemende pakketten gelden de huidige verkoopprijzen.')}</p><button class="text-btn" data-act="rules">${tr('Read full offer terms','Lees alle actievoorwaarden')}</button></details></div></div><div class="section-top"><div><h2>${tr('Find your next favorite','Vind je volgende favoriet')}</h2><p>${tr('Eligible kits to complete your selection.','Deelnemende pakketten om je selectie aan te vullen.')}</p></div></div>${cards(products.filter(x=>x.id!==p.id&&x.cat===p.cat).slice(0,3))}</div>`}
function progress(){const c=calc(),remainder=c.n%3,remaining=3-remainder;let headline=c.n===0?tr('Choose 3 kits and pay for 2.','Kies 3 pakketten en betaal er 2.'):c.n<3?tr(`Choose ${remaining} more ${remaining===1?'kit':'kits'} for 2+1 free.`,`Kies nog ${remaining} ${remaining===1?'pakket':'pakketten'} voor 2+1 gratis.`):tr(`${c.freeCount} ${c.freeCount===1?'kit is':'kits are'} free — you save ${money(c.saving)}.`,`${c.freeCount} ${c.freeCount===1?'pakket':'pakketten'} gratis — je bespaart ${money(c.saving)}.`);return `<section class="cart-progress">${tag('05',tr('Quantity progress','Voortgang op aantal'))}<strong>${headline}</strong><div class="progress-track" role="progressbar" aria-label="${tr('Progress toward 2+1','Voortgang naar 2+1')}" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${c.n>0&&remainder===0?3:remainder}">${[0,1,2].map(i=>`<span class="${i<(c.n>0&&remainder===0?3:remainder)?'done':''}"></span>`).join('')}</div><p class="small">${c.n>=3&&remainder?tr(`Choose ${remaining} more for the next free kit. `,`Kies er nog ${remaining} voor het volgende gratis pakket. `):''}${term()}</p></section>`}
function cartLines(){const c=calc();return products.filter(p=>state.cart[p.id]).map(p=>{const qty=state.cart[p.id],free=c.free[p.id]||0;return `<div class="cart-line">${art(p,true)}<div class="line-info"><h3>${name(p)}</h3><div class="qty"><button data-act="qty" data-id="${p.id}" data-delta="-1" aria-label="${tr('Remove one','Verwijder één')} ${name(p)}">−</button><span>${qty}</span><button data-act="qty" data-id="${p.id}" data-delta="1" aria-label="${tr('Add one','Voeg één toe')} ${name(p)}">+</button></div>${free?`<div style="margin-top:7px"><span class="pill">${free} × ${tr('FREE with 2+1','GRATIS met 2+1')}</span></div>`:''}</div><div class="line-end"><span class="price">${free?`<del class="ref-price">${money(qty*p.price)}</del>`:''}${money((qty-free)*p.price)}</span><button class="text-btn" data-act="remove" data-id="${p.id}">${tr('Remove','Verwijderen')}</button></div></div>`}).join('')}
function changeMessage(){if(!state.change)return '';const x=state.change;return `<div class="change-log">${tr('Basket updated.','Winkelwagen aangepast.')} ${tr('Previous total','Vorig totaal')}: <b>${money(x.before)}</b> → ${tr('new total','nieuw totaal')}: <b>${money(x.after)}</b>. ${x.from==='bogo'&&x.to==='none'?tr('The basket now has fewer than 3 eligible kits, so the 2+1 discount no longer applies.','De winkelwagen bevat nu minder dan 3 deelnemende pakketten, dus de 2+1-korting vervalt.'):x.from==='none'&&x.to==='bogo'?tr('2+1 free has been applied automatically.','2+1 gratis is automatisch toegepast.'):tr('Your 2+1 saving has been recalculated.','Je 2+1-besparing is opnieuw berekend.')}</div>`}
function recommendations(){const c=calc();const first=products.find(p=>state.cart[p.id]);const list=products.filter(p=>!state.cart[p.id]).sort((a,b)=>(b.cat===first?.cat)-(a.cat===first?.cat)).slice(0,2);if(!list.length)return '';return `<section class="recs">${tag('06',tr('Guided recommendations','Gerichte aanbevelingen'))}<h3 style="margin-top:12px">${c.n%3===2?tr('Choose your third kit','Kies je derde pakket'):tr('Complete your selection','Maak je selectie compleet')}</h3>${list.map(p=>{const next=calc({...state.cart,[p.id]:1});return `<div class="rec">${art(p,true)}<div><b>${name(p)}</b><p>${money(p.price)} · ${tr('Eligible','Deelnemend')}</p><p>${tr('New basket total','Nieuw totaal')}: <b>${money(next.total)}</b></p></div><button data-act="rec-add" data-id="${p.id}">+ ${tr('Add','Voeg toe')}</button></div>`}).join('')}</section>`}
function summary(){const c=calc();return `<section class="summarybox">${tag('07',tr('Automatic 2+1 saving','Automatische 2+1-besparing'))}<h3>${tr('Order summary','Besteloverzicht')}</h3><div class="sumrow"><span>${tr('Subtotal','Subtotaal')} (${c.n})</span><span>${money(c.subtotal)}</span></div><div class="sumrow discountrow"><span>${tr('2+1 free','2+1 gratis')}</span><span>−${money(c.saving)}</span></div><div class="sumrow"><span>${tr('Delivery · NL / BE','Bezorging · NL / BE')}</span><span>${tr('Free','Gratis')}</span></div><div class="sumrow total"><span>${tr('Total','Totaal')}</span><span class="cart-total">${money(c.total)}</span></div>${c.active==='bogo'?`<div class="applied" style="margin-top:15px">✓ ${tr('2+1 free applied automatically.','2+1 gratis automatisch toegepast.')}<br>${tr('No discount code needed.','Geen kortingscode nodig.')}</div>`:`<p class="small muted" style="margin-top:15px">${tr('The 2+1 offer activates when 3 eligible kits are in your basket.','De 2+1-actie wordt actief zodra er 3 deelnemende pakketten in je winkelwagen zitten.')}</p>`}<button class="primary wide" style="margin-top:18px" data-act="checkout" ${!c.n?'disabled':''}>${tr('Continue to checkout','Verder naar afrekenen')} →</button><p class="small muted" style="text-align:center;margin-top:9px">${tr('Prototype · order summary only','Prototype · alleen besteloverzicht')}</p></section>`}
function cart(){const c=calc();return `<div class="page"><div class="row between"><h1 style="font-size:34px">${txt('cart')}</h1><button class="text-btn" data-act="page" data-id="collection">← ${tr('Continue shopping','Verder winkelen')}</button></div>${c.n?`<div class="cart-layout"><div>${progress()}${changeMessage()}${cartLines()}${gifts()}${recommendations()}</div><div style="padding-top:16px">${summary()}</div></div>`:`<div style="margin-top:20px">${progress()}<div class="empty"><h3>${tr('Your next project is waiting.','Je volgende project wacht op je.')}</h3><p>${tr('Start with a favorite, then mix and match.','Begin met een favoriet en combineer verder.')}</p><button class="primary" data-act="page" data-id="collection">${tr('Explore kits','Bekijk bouwpakketten')}</button></div></div>`}</div>`}
function render(){document.documentElement.lang=state.lang;document.title=tr('Bouwpakket — Holiday offer wireframe','Bouwpakket — Wireframe feestdagenactie');document.body.classList.toggle('hide-notes',!state.notes);document.getElementById('app').innerHTML=toolbar()+`<main class="workspace ${!state.notes?'no-aside':''}"><div class="preview ${state.mobile?'mobile':''}"><div class="browserline"><span class="dots">● ● ●</span><span class="url">bouwpakket.com / ${state.page==='home'?'':state.page}</span><span>${tr('WIREFRAME','WIREFRAME')}</span></div><div class="store">${header()}${({home,collection,product:pdp,cart})[state.page]()}${footer()}</div><div class="screen-foot">${tr('Interactive concept • 6 November launch • Dates to be confirmed','Interactief concept • Start 6 november • Datums nog te bevestigen')}</div></div>${state.notes?notesPanel():''}</main>`;if(state.drawer)renderDrawer();if(state.modal)renderModal();}
function renderDrawer(){const d=document.getElementById('drawer'),c=calc();d.innerHTML=`<div class="modal-head"><h2 id="drawer-title">${txt('cart')} <span class="count">${c.n}</span></h2><button data-act="close-drawer" aria-label="${tr('Close basket','Sluit winkelwagen')}">×</button></div><div class="modal-body">${progress()}${changeMessage()}${c.n?cartLines():`<p class="muted">${tr('Your basket is empty.','Je winkelwagen is leeg.')}</p>`}${c.n?gifts()+recommendations():''}${summary()}<button class="text-btn wide" style="margin-top:15px" data-act="full-cart">${tr('View full basket','Bekijk volledige winkelwagen')} →</button></div>`;if(!d.open)d.showModal();}
function renderModal(){const d=document.getElementById('detail-modal');let title='',body='';if(state.modal==='rules'){title=tr('Buy 2, get 1 free.','Koop er 2, krijg er 1 gratis.');body=`<div class="offer-card"><h3>${tr('Choose 3 kits. Pay for 2.','Kies 3 pakketten. Betaal er 2.')}</h3><p>${tr('Add all 3 eligible kits. The cheapest becomes free automatically. Mix different kits or choose more than one of the same kit. No code needed.','Voeg alle 3 deelnemende pakketten toe. Het goedkoopste wordt automatisch gratis. Combineer verschillende pakketten of kies meerdere van hetzelfde. Geen code nodig.')}</p></div><ul class="rules-list"><li>${tr('The reward repeats every three eligible units: 3 kits means 1 free; 6 kits means 2 free. The lowest-priced eligible units receive the discount.','De beloning herhaalt zich per drie deelnemende pakketten: bij 3 is er 1 gratis; bij 6 zijn er 2 gratis. De goedkoopste deelnemende pakketten krijgen de korting.')}</li><li>${tr('With fewer than 3 eligible kits, the current selling prices apply. You can still check out with a smaller order.','Bij minder dan 3 deelnemende pakketten gelden de huidige verkoopprijzen. Je kunt ook met een kleinere bestelling afrekenen.')}</li><li>${tr('Savings use current selling prices, not crossed-out reference prices. Changes to your basket recalculate the free item and total.','De besparing is gebaseerd op de huidige verkoopprijzen, niet op doorgestreepte referentieprijzen. Bij wijzigingen in de winkelwagen worden het gratis pakket en het totaal opnieuw berekend.')}</li><li>${tr('Your free storage bag and mini building kit remain included alongside the 2+1 offer. These gifts do not count toward the three eligible kits. Delivery is free in NL and BE.','Je gratis opbergtas en mini-bouwpakket blijven inbegrepen naast de 2+1-actie. Deze cadeaus tellen niet mee voor de drie deelnemende pakketten. Bezorging is gratis in NL en BE.')}</li></ul><div class="gift-note">${tr('Review note: all six sample kits qualify in this prototype. Final eligibility, repeatability and exact campaign dates still need client approval. The displayed countdown uses fixed sample values; the final deadline will be configured later.','Reviewnotitie: alle zes voorbeeldpakketten doen mee in dit prototype. Definitieve deelname, herhaling en exacte campagnedatums vereisen nog goedkeuring. De getoonde timer gebruikt vaste voorbeeldwaarden; de definitieve deadline wordt later ingesteld.')}</div>`;}else if(state.modal==='checkout'){const c=calc();title=tr('Checkout handoff preview','Voorbeeld overdracht naar afrekenen');body=`<span class="review-flag">${tr('Prototype endpoint','Eindpunt van prototype')}</span><h3 style="margin:16px 0">${tr('This is the amount carried into checkout.','Dit bedrag gaat mee naar de checkout.')}</h3><div class="sumrow"><span>${tr('Kits','Bouwpakketten')}</span><b>${c.n}</b></div><div class="sumrow"><span>${tr('Active offer','Actieve actie')}</span><b>${c.active==='bogo'?'2+1':tr('None','Geen')}</b></div><div class="sumrow total"><span>${tr('Total','Totaal')}</span><b>${money(c.total)}</b></div><p class="small muted" style="margin-top:20px">${tr('No payment or customer information is collected. Production implementation must verify that Shopify checkout returns the same discount and total.','Er worden geen betaal- of klantgegevens verzameld. Bij implementatie moet worden gecontroleerd of Shopify dezelfde korting en hetzelfde totaal toont.')}</p>`;}else if(state.modal.startsWith('note:')){const id=state.modal.split(':')[1];const [ttl,b,a]=notes[id]();title=id+' · '+ttl;body=`<div class="stack"><div><div class="eyebrow">${tr('Observed','Huidig')}</div><p style="margin-top:10px">${b}</p></div><div><div class="eyebrow">${tr('Proposed change','Voorgestelde wijziging')}</div><p style="margin-top:10px">${a}</p></div></div>`;}d.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button data-act="close-modal" aria-label="${tr('Close','Sluiten')}">×</button></div><div class="modal-body">${body}</div>`;if(!d.open)d.showModal();}
let toastTimer;function say(msg){const el=document.getElementById('announcer');el.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.textContent='',3500);}
function mutate(fn){const before=calc();fn();const after=calc();state.change={before:before.total,after:after.total,from:before.active,to:after.active};render();}
function closeDrawer(){state.drawer=false;document.getElementById('drawer').close();}
function go(page){closeDrawer();state.page=page;state.change=null;render();window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;if(a==='page')go(id);else if(a==='lang'){state.lang=id;render();}else if(a==='device'){state.mobile=id==='mobile';render();}else if(a==='notes'){state.notes=!state.notes;render();}else if(a==='note'){state.modal='note:'+id;renderModal();}else if(a==='category'){state.category=id;render();}else if(a==='product'){state.product=id;state.qty=1;go('product');}else if(a==='grid')document.getElementById('product-grid').scrollIntoView({behavior:'smooth',block:'start'});else if(a==='pqty'){state.qty=Math.max(1,Math.min(99,state.qty+Number(b.dataset.delta)));render();}else if(a==='pdp-quick-add'){mutate(()=>state.cart[id]=(state.cart[id]||0)+1);say(tr('Added to basket','Toegevoegd aan winkelwagen'));}else if(a==='add'||a==='add-product'||a==='rec-add'){const pid=a==='add-product'?state.product:id,amount=a==='add-product'?state.qty:1;state.drawer=a==='rec-add'?state.drawer:true;mutate(()=>state.cart[pid]=(state.cart[pid]||0)+amount);say(tr('Basket updated','Winkelwagen bijgewerkt'));}else if(a==='qty'){mutate(()=>{state.cart[id]=Math.max(0,(state.cart[id]||0)+Number(b.dataset.delta));});}else if(a==='remove'){mutate(()=>{delete state.cart[id];});}else if(a==='drawer'){state.drawer=true;renderDrawer();}else if(a==='close-drawer')closeDrawer();else if(a==='full-cart')go('cart');else if(a==='rules'||a==='checkout'){state.modal=a;renderModal();}else if(a==='close-modal'){state.modal=null;document.getElementById('detail-modal').close();}});
document.addEventListener('submit',e=>{if(e.target.id==='newsletter-form'){e.preventDefault();say(tr('Prototype only — no signup submitted.','Alleen een prototype — geen aanmelding verstuurd.'));}});
document.addEventListener('change',e=>{if(e.target.id==='phase'){state.phase=e.target.value;render();}else if(e.target.id==='sort'){state.sort=e.target.value;render();}else if(e.target.id==='scenario'){const s=e.target.value;if(!s)return;const scenarios={one:{owl:1},two:{owl:1,shark:1},three:{owl:1,shark:1,bear:1},mixed:{car:1,peacock:1,bear:1},six:{owl:3,shark:3},empty:{}};state.cart={...scenarios[s]};state.change=null;go('cart');}});
document.getElementById('drawer').addEventListener('close',()=>state.drawer=false);document.getElementById('detail-modal').addEventListener('close',()=>state.modal=null);
render();
</script></body></html>
