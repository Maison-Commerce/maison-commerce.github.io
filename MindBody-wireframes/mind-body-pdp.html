function rerender(){const y=scrollY;const focused=document.activeElement;let selector=null;if(focused){for(const a of ['data-flavor','data-people','data-shot','data-system','data-action'])if(focused.hasAttribute(a))selector='['+a+'="'+focused.getAttribute(a)+'"]';if(focused.name==='plan')selector='input[value="'+focused.value+'"]';}const openIds=[...document.querySelectorAll('details')].map(d=>d.open);render();document.querySelectorAll('details').forEach((d,i)=>d.open=!!openIds[i]);if(selector)document.querySelector(selector)?.focus({preventScroll:true});window.scrollTo(0,y);}
function showDialog(title,body){lastFocus=document.activeElement;const modal=document.createElement('div');modal.className='zoom';modal.innerHTML=`<div class="zoom-panel" role="dialog" aria-modal="true" aria-label="${title}"><button>${t('Sluiten','Close')} ×</button><h2>${title}</h2><div>${body}</div></div>`;document.body.append(modal);const close=()=>{modal.remove();document.body.style.overflow='';lastFocus?.focus();};modal.querySelector('button').onclick=close;modal.onclick=e=>{if(e.target===modal)close();};modal.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();modal.querySelector('button').focus();}};document.body.style.overflow='hidden';modal.querySelector('button').focus();}
function action(a){if(a==='pair-add'){state.cart++;rerender();feedback(t('Daily Shaker toegevoegd aan je demotas — ','Daily Shaker added to your demo bag — ')+money(1499));}else if(a==='bundle-add'){state.cart+=state.people+1;const total=offerPrice().price;rerender();feedback(t('Daily Stack + Kids Gummies toegevoegd als demobundel — ','Daily Stack + Kids Gummies added as a demo bundle — ')+money(total));}else if(a==='klarna'){showDialog('Klarna',t('Dit is een visuele demo van betalen in 3 delen. De bedragen volgen het gekozen ordertotaal. Er is geen verbinding met Klarna; beschikbaarheid en betaalvoorwaarden zijn niet bevestigd.','This is a visual demo of paying in 3 installments. Amounts follow the selected order total. There is no Klarna connection; availability and payment terms are not confirmed.'));}else if(a==='desktop' ||a==='mobile'){state.mobile=a==='mobile';rerender();}else if(a==='notes'){state.notes=!state.notes;rerender();}else if(a==='locale'){state.lang=state.lang==='nl'?'en':'nl';rerender();}else if(a==='stock'){state.stock=!state.stock;rerender();}else if(a==='print'){document.querySelectorAll('details').forEach(d=>d.open=true);window.print();}else if(a==='add'){state.cart+=state.people;rerender();feedback(t('Toegevoegd aan je demotas: ','Added to your demo bag: ')+state.people+' × Daily Stack · '+flavors()[state.flavor]+' · '+planName(state.plan)+' · '+money(pricing().charge)+'. '+t('Geen bestelling geplaatst.','No order placed.'));}else if(a==='cart'){feedback(t('Je demotas bevat ','Your demo bag contains ')+state.cart+t(' verpakking(en). De cart drawer volgt in een aparte ronde.',' pack(s). The cart drawer will follow in a separate round.'));}else if(a==='future'){feedback(t('Deze productpagina wordt in een volgende ronde uitgewerkt.','This product page will be developed in a later round.'));}else if(a==='back'){document.getElementById('buy').scrollIntoView({behavior:'smooth'});}else if(a==='zoom'){lastFocus=document.activeElement;const modal=document.createElement('div');modal.className='zoom';modal.innerHTML=`<div class="zoom-panel" role="dialog" aria-modal="true" aria-label="${t('Productbeeld','Product image')}"><button>${t('Sluiten','Close')} ×</button>${placeholder(shots()[state.shot],flavors()[state.flavor]+' · '+t('30 sachets · 7g','30 sachets · 7g'))}</div>`;document.body.append(modal);const close=()=>{modal.remove();document.body.style.overflow='';lastFocus?.focus();};modal.querySelector('button').onclick=close;modal.onclick=e=>{if(e.target===modal)close();};modal.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();modal.querySelector('button').focus();}};document.body.style.overflow='hidden';modal.querySelector('button').focus();}}
render();
</script></body></html>
