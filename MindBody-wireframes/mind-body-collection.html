{id:'duo',name:'Flavor Duo',audiences:['adults'],formats:['sachet'],diets:['vegan','halal','glutenfree'],goals:['energy','focus','digestion','immunity'],flavors:FLAVORS.map((n,i)=>'adult-'+i),once:6648,sub:5698,days:60,rating:4.4,count:5,popularity:60,date:'2026-09-05',badge:''}
];
const t=(nl,en)=>state.lang==='nl'?nl:en;
const euro=n=>new Intl.NumberFormat(state.lang==='nl'?'nl-NL':'en-IE',{style:'currency',currency:'EUR'}).format(n/100);
const labels=()=>({goal:t('Doel','Goal'),flavor:t('Smaak','Flavor'),for:t('Voor wie','For'),format:t('Formaat','Format'),diet:t('Voedingseisen','Dietary')});

function params(){const q=new URLSearchParams(location.search);state.lang=['nl','en'].includes(q.get('lang'))?q.get('lang'):'nl';state.collection=['all','adults','kids','bundles'].includes(q.get('collection'))?q.get('collection'):'all';state.sort=['popular','rating','low','high','new'].includes(q.get('sort'))?q.get('sort'):'popular';state.mobile=q.get('view')==='mobile';state.filters=structuredClone(EMPTY);for(const key of Object.keys(EMPTY)){state.filters[key]=(q.get(key)||'').split(',').filter(v=>values()[key].some(([id])=>id===v));}}
function homeUrl(){return (location.protocol==='file:'?'mind-body-homepage.html':'homepage-wireframe.html')+'?lang='+state.lang;}
function pdpUrl(anchor='buy',flavor=0,offer='',plan='monthly'){const q=new URLSearchParams({lang:state.lang,plan,flavor:String(flavor)});if(offer)q.set('offer',offer);return (location.protocol==='file:'?'mind-body-pdp.html':'pdp-wireframe.html')+'?'+q+'#'+anchor;}
function collectionUrl(collection){const q=new URLSearchParams({collection,lang:state.lang});if(state.mobile)q.set('view','mobile');return location.pathname+'?'+q;}
function syncUrl(){const q=new URLSearchParams({collection:state.collection,lang:state.lang});if(state.mobile)q.set('view','mobile');for(const [k,v] of Object.entries(state.filters))if(v.length)q.set(k,v.join(','));if(state.sort!=='popular')q.set('sort',state.sort);try{history.pushState(null,'',location.pathname+'?'+q);}catch{} }
function alignVariants(){const selected=state.filters.flavor;for(const p of products){const prefix=p.id==='kids'?'kids-':'adult-';const match=selected.find(v=>v.startsWith(prefix)&&p.flavors.includes(v));if(match)state.variants[p.id]=Number(match.split('-')[1]);}}
function baseProducts(){return products.filter(p=>state.collection==='all'||state.collection==='bundles'&&['family','duo'].includes(p.id)||state.collection==='adults'&&p.audiences.includes('adults')||state.collection==='kids'&&p.id==='kids');}
function matches(p,f=state.filters,skip=''){const map={goal:'goals',flavor:'flavors',for:'audiences',format:'formats',diet:'diets'};return Object.entries(f).every(([k,v])=>k===skip||!v.length||v.some(x=>p[map[k]].includes(x)));}
function resultProducts(f=state.filters){const arr=baseProducts().filter(p=>matches(p,f));return arr.sort((a,b)=>state.sort==='low'?a.sub-b.sub:state.sort==='high'?b.sub-a.sub:state.sort==='rating'?b.rating-a.rating:state.sort==='new'?b.date.localeCompare(a.date):b.popularity-a.popularity);}
function facetCount(key,val,f){return baseProducts().filter(p=>matches(p,f,key)&&matches(p,{...EMPTY,[key]:[val]})).length;}
function countFilters(f=state.filters){return Object.values(f).reduce((a,v)=>a+v.length,0);}
function closest(){const map={goal:'goals',flavor:'flavors',for:'audiences',format:'formats',diet:'diets'};return [...products].sort((a,b)=>{const score=p=>Object.entries(state.filters).reduce((n,[k,v])=>n+v.filter(x=>p[map[k]].includes(x)).length,0);return score(b)-score(a)||b.popularity-a.popularity;}).slice(0,3);}
function selectedFlavor(p){const pick=state.variants[p.id]||0;return p.id==='kids'?KIDS[pick]:FLAVORS[pick];}
function unavailable(p){return p.id==='adult'&&state.variants.adult===4;}
function labelFor(k,id){return values()[k].find(([v])=>v===id)?.[1]||id;}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function filterFields(f,prefix='desktop'){return `<div class="filter-sidebar ${prefix==='desktop'?'desktop':''}">${Object.keys(EMPTY).filter(k=>!(k==='for'&&state.collection!=='all')).map(k=>`<div><h3>${labels()[k]}</h3>${values()[k].map(([id,label])=>{const n=facetCount(k,id,f);return `<label class="check-row ${n===0?'zero':''}"><input type="checkbox" data-filter="${k}" data-value="${id}" ${f[k].includes(id)?'checked':''} ${n===0&&!f[k].includes(id)?'disabled':''}><span>${label}</span><span class="facet-count">${n}</span></label>`;}).join('')}</div>`).join('')}</div>`;}
function chips(){return `<div class="chips">${Object.entries(state.filters).flatMap(([k,v])=>v.map(id=>`<button class="chip" data-remove-key="${k}" data-remove-value="${id}" aria-label="${t('Verwijder filter','Remove filter')} ${labelFor(k,id)}">${labelFor(k,id)} ×</button>`)).join('')}${countFilters()?`<button class="chip clear" data-action="clear">${t('Wis alles','Clear all')}</button>`:''}</div>`;}
function card(p,suggested=false){if(p.id==='family'&&!suggested)return familyTile();const flavorCount=p.id==='kids'?KIDS.length:FLAVORS.length;const badge=p.badge==='bestseller'?'Bestseller':p.badge==='new'?t('Nieuw','New'):p.badge==='value'?t('Beste waarde','Best value'):'';return `<article class="card ${p.id==='duo'?'bundle-duo':''}"><div class="card-image">${badge?`<span class="product-badge">${badge}</span>`:''}<div><b>Mind & Body<br>${p.name}</b><small>${p.id==='kids'?t('Gummies · 30 porties','Gummies · 30 servings'):p.id==='family'?'Daily Stack + Kids':p.id==='duo'?t('2 dozen · 60 sachets','2 boxes · 60 sachets'):t('30 sachets · 7g','30 sachets · 7g')}</small></div></div><div class="card-body"><h3>Mind & Body ${p.name}</h3><a class="card-rating" ${p.id==='adult'?`href="${pdpUrl('reviews',state.variants.adult)}"`:'href="#comparison"'}>★ ${String(p.rating).replace('.',state.lang==='nl'?',':'.')} (${p.count}) · ${t('demo','demo')}</a><div class="flavor-label">${flavorCount} ${t('smaken beschikbaar','flavors available')}${unavailable(p)?' · '+t('Geselecteerde smaak uitverkocht','Selected flavor sold out'):''}</div><div class="card-price"><span>${t('Vanaf','From')}</span> <b>${euro(p.sub)}</b></div><div class="diet-line">${p.diets.map(x=>labelFor('diet',x)).join(' · ')}*</div><div class="qty-hint">${p.id==='adult'?t('Voor 2 personen: 5% extra voordeel','For 2 people: 5% extra savings'):p.id==='duo'?t('5% voordeel op twee dozen','Save 5% on two boxes'):p.id==='family'?t('Bundelvoordeel: 15%','Bundle savings: 15%'):t('Combineer met Daily Stack: 15% voordeel','Pair with Daily Stack: save 15%')}</div>${unavailable(p)?`<button class="primary" data-restock="${p.id}">${t('Houd me op de hoogte','Notify me')}</button>`:p.id==='adult'?`<a class="primary" href="${pdpUrl('buy',state.variants.adult)}">${t('Bekijk product','View product')} →</a>`:p.id==='family'?`<a class="primary" href="${pdpUrl('buy',state.variants.family,'bundle')}">${t('Bekijk bundel','View bundle')} →</a>`:`<button class="primary" data-preview="${p.id}">${t('Bekijk product','View product')} →</button>`}</div></article>`;}
function familyTile(){return `<article class="family-tile"><div class="eyebrow">${t('BESTE WAARDE','BEST VALUE')}</div><h2>${t('Het hele gezin.<br>Eén levering.','The whole family.<br>One delivery.')}</h2><p>${t('Daily Stack + Kids Gummies. Eén abonnement, één bezorging, één rekening.','Daily Stack + Kids Gummies. One subscription, one delivery, one bill.')}</p><div class="family-visual"><div>DAILY<br>STACK<small>30 × 7g<br>${FLAVORS.length} ${t('smaken beschikbaar','flavors available')}</small></div><span>＋</span><div>KIDS<br>GUMMIES<small>${t('30 porties','30 servings')}</small></div></div><div class="fine">★ ${t('4,6 (5) · demoreviews','4.6 (5) · demo reviews')}</div><div class="family-price"><span class="fine">${t('Vanaf','From')}</span> ${euro(4673)}</div><div class="fine">${t('1 volwassene + 1 kind','1 adult + 1 child')}</div><p style="margin:15px 0"><b>${t('Bespaar 15%','Save 15%')}</b><br><span class="fine">${t('Vergeleken met apart maandelijks bestellen.','Compared with separate monthly orders.')}</span></p><p class="fine">${t('Vegan · Glutenvrij*','Vegan · Gluten-free*')}</p><a class="primary" href="${pdpUrl('buy',state.variants.family,'bundle')}">${t('Bekijk je gezinsbundel','Explore your family bundle')} →</a></article>`;}
function grid(){const list=resultProducts();let items=list.map(p=>card(p));if(state.collection==='kids'&&list.length)items.push(familyTile());if(!list.length)return `<div class="no-results"><div class="eyebrow">${t('GEEN EXACTE MATCH','NO EXACT MATCH')}</div><h2>${t('Laten we iets vinden<br>dat wel past.','Let’s find something<br>that does fit.')}</h2><p>${t('Deze combinatie levert geen producten op. Wis de filters of bekijk de suggesties hieronder; die voldoen niet aan alle gekozen filters.','This combination returns no products. Clear your filters or explore the suggestions below; these do not match every selected filter.')}</p><button class="primary" data-action="clear">${t('Wis filters','Clear filters')} →</button></div><h3 class="closest-label">${t('Dit komt het dichtst in de buurt','These are the closest matches')}</h3><div class="no-results-grid">${closest().map(p=>card(p,true)).join('')}</div>`;return `<div class="product-grid">${items.join('')}</div>${state.collection==='kids'?`<p class="fine" style="margin:14px 0">${t('De gezinsbundel is een aanvullende suggestie en telt niet mee in het zoekresultaat.','The family bundle is an additional suggestion and is not included in the result count.')}</p>`:''}`;}
function comparison(){return `<div class="collection-compare" id="comparison" ${state.compare?'':'hidden'}><div class="table-scroll" tabindex="0"><table><thead><tr><th>${t('Vergelijk','Compare')}</th><th>Daily Stack</th><th>Kids Gummies</th><th>Family Bundle</th><th>Flavor Duo</th></tr></thead><tbody>${[
[t('Voor wie','For'),t('Volwassenen','Adults'),t('Kinderen','Kids'),t('Volwassene + kind','Adult + child'),t('Volwassenen','Adults')],
[t('Formaat','Format'),t('Sachets','Sachets'),t('Gummies','Gummies'),t('Sachets + gummies','Sachets + gummies'),t('2 dozen sachets','2 boxes of sachets')],
[t('Hoeveelheid','Quantity'),'30', '30', '30 + 30','60'],
[t('Abonnementsprijs','Subscription price'),euro(2999),euro(2499),euro(4673),euro(5698)],
[t('Prijs per dag','Price per day'),euro(100),euro(83),euro(156),euro(95)],
[t('Foundations Guide','Foundations Guide'),t('Inbegrepen','Included'),t('Inbegrepen','Included'),t('Inbegrepen','Included'),t('Inbegrepen','Included')],
[t('Community','Community'),t('Bij abonnement','With subscription'),t('Voor de ouder bij abonnement','For the parent with subscription'),t('Bij abonnement','With subscription'),t('Bij abonnement','With subscription')]
].map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="sample-label">${t('Fictieve catalogusgegevens. Bij Flavor Duo geldt de dagprijs voor één persoon en 60 dagen voorraad.','Fictional catalog data. Flavor Duo daily price covers one person and a 60-day supply.')}</p></div>`;}
function render(){document.documentElement.lang=state.lang;const list=resultProducts();const title=state.collection==='all'?t('Een basis voor ieder van jullie.','A foundation for each of you.'):state.collection==='adults'?t('Jouw dagelijkse basis.','Your daily foundation.'):state.collection==='kids'?t('Een eigen ritueel voor je kind.','A ritual of their own.'):t('Samen kiezen. Samen besparen.','Choose together. Save together.');
document.getElementById('app').innerHTML=`<div class="reviewbar"><div><strong>MIND & BODY <span style="font-weight:400;color:#aaa">/ COLLECTION WIREFRAME</span></strong><small>${t('Shop · producten vergelijken en kiezen','Shop · compare and choose products')}</small></div><div class="tools"><button data-action="desktop" class="${!state.mobile?'active':''}">Desktop</button><button data-action="mobile" class="${state.mobile?'active':''}">${t('Mobiel','Mobile')} · 375</button><button data-action="print">${t('Afdrukken','Print')}</button><button data-action="homepage">Homepage ↗</button></div></div><div class="draftbar">${t('DEMO-WIREFRAME — Producten, doelindeling, reviews, voorraad en prijzen zijn voorbeeldinhoud. Geen webshop of gezondheidsadvies.','DEMO WIREFRAME — Products, goal categories, reviews, inventory and prices are sample content. Not a store or health advice.')}</div>
<div class="viewport collection ${state.mobile?'mobile mobile-surface':''}" style="${state.mobile?'max-width:375px':''}"><div class="announcement">${t('Voor 23:00 besteld, morgen in huis (NL, ma–vr)','Order before 23:00, next-day delivery (NL, Mon–Fri)')}</div><header class="nav"><a class="wordmark" href="${homeUrl()}" style="text-decoration:none">mind<span>&</span>body</a><nav class="navlinks"><a href="${collectionUrl('all')}">Shop</a><a href="${pdpUrl('science')}">${t('Onze wetenschap','Our science')}</a><a href="${collectionUrl('bundles')}">${t('Gezin & bundels','Family & bundles')}</a></nav><button class="locale" data-action="locale">${state.lang.toUpperCase()} ↓</button><a class="locale" href="${pdpUrl()}">Daily Stack ↗</a></header>
<main class="wrap"><div class="breadcrumb"><a href="${homeUrl()}">Home</a> / ${t('Shop','Shop')} / ${audienceNames().find(([id])=>id===state.collection)[1]}</div><div class="collection-head"><div><div class="eyebrow">01 / ${t('DE COLLECTIE','THE COLLECTION')}</div><h1>${title}</h1><p>${t('Dagelijkse voeding voor jou en je gezin. Met de community en begeleiding om je routine vol te houden.','Daily nutrition for you and your family. With community and guidance to help you keep your routine.')}</p></div><span class="catalogue-size">${products.length} ${t('producten · smaken als opties','products · flavors as options')}</span></div>
<nav class="audience-tabs" aria-label="${t('Collecties','Collections')}">${audienceNames().map(([id,label])=>`<a href="${collectionUrl(id)}" ${state.collection===id?'aria-current="page"':''}>${label}</a>`).join('')}</nav>
<div class="browse-toolbar"><div class="result-count" aria-live="polite">${list.length} ${t('van','of')} ${baseProducts().length} ${t('producten','products')}</div><div class="browse-actions"><button data-action="sidebar">${state.sidebar?t('Verberg filters','Hide filters'):t('Toon filters','Show filters')}${countFilters()?' ('+countFilters()+')':''}</button><label class="sort-label">${t('Sorteer op','Sort by')}<select id="sort">${sorts().map(([id,label])=>`<option value="${id}" ${state.sort===id?'selected':''}>${label}</option>`).join('')}</select></label></div></div>
<div class="browse-layout ${!state.sidebar?'no-sidebar':''}">${state.sidebar?filterFields(state.filters):''}<div class="results-area">${chips()}${grid()}<p class="fine" style="margin:18px 0 0">${t('*Voedingseisen en doelindeling zijn demo-eigenschappen. Abonnementsprijzen zijn de basis voor sorteren op prijs.','*Dietary and goal categories are demo attributes. Subscription prices are used for price sorting.')}</p></div></div>
<div class="trust"><a href="#faq"><b>◇</b>${t('30 dagen<br>niet-goed-geld-terug','30-day<br>money-back guarantee')}</a><a href="${pdpUrl('science')}"><b>⊕</b>${t('Inzicht in<br>testinformatie','Inspect<br>testing information')}</a><a href="#faq"><b>↗</b>${t('Gratis verzending<br>bij abonnement','Free shipping<br>with subscription')}</a><a href="${homeUrl()}#founder"><b>◎</b>${t('Gemaakt in<br>Nederland','Made in<br>Holland')}</a><a href="#faq"><b>◷</b>${t('Vóór 23:00 → morgen<br>NL, ma–vr','Before 23:00 → tomorrow<br>NL, Mon–Fri')}</a></div>
<section class="compare-entry"><div><div class="eyebrow">07 / ${t('NOG EVEN VERGELIJKEN?','STILL COMPARING?')}</div><h2>${t('Wat past bij jullie?','What fits your household?')}</h2><p>${t('Vergelijk formaat, inhoud en prijs per dag. Alles naast elkaar.','Compare format, contents and price per day. Everything side by side.')}</p></div><button data-action="compare" aria-expanded="${state.compare}" aria-controls="comparison">${state.compare?t('Sluit vergelijking','Close comparison'):t('Vergelijk producten','Compare products')} ${state.compare?'−':'→'}</button></section>${comparison()}
<section class="section" id="faq"><div class="section-head"><div><div class="eyebrow">08 / FAQ</div><h2>${t('Voordat je kiest.','Before you choose.')}</h2></div><p class="lede">${t('Vier antwoorden over ons assortiment.','Four answers about our range.')}</p></div><div class="cols2"><p class="lede">${t('Een smaak, een formaat of een hele gezinsroutine. Begin met wat bij jou past.','A flavor, a format or a whole-family routine. Start with what fits you.')}</p><div class="details">${faq().map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></div></section>
<footer class="collection-footer"><div><a class="wordmark" href="${homeUrl()}" style="text-decoration:none">mind<span>&</span>body</a><p>${t('Voedingssupplementen zijn geen vervanging voor een gevarieerde voeding en een gezonde levensstijl.','Food supplements are not a substitute for a varied diet and a healthy lifestyle.')}</p><p>${t('Voorbeeldcatalogus · geen live bestellingen','Sample catalog · no live orders')}</p></div><div><div class="links"><a href="${homeUrl()}">Homepage</a><a href="${pdpUrl()}">Daily Stack</a><a href="${collectionUrl('bundles')}">${t('Bundels','Bundles')}</a><a href="#faq">FAQ</a></div><div class="payments"><span>iDEAL</span><span>Klarna</span><span>VISA</span><span>Mastercard</span><span>PayPal</span></div></div></footer></main>
<div class="mobile-browse-bar"><button data-action="filters-sheet">${t('Filters','Filters')}${countFilters()?' ('+countFilters()+')':''}</button><button data-action="sort-sheet">${t('Sorteren','Sort')}</button></div></div>`;bind();}
function faq(){return [
[t('Wat is het verschil tussen Daily Stack en Kids Gummies?','What is the difference between Daily Stack and Kids Gummies?'),t('Daily Stack is de volwassenvariant in sachets. Kids Gummies is de kindervariant in gummyvorm. Ze hebben een eigen formule en gebruiksaanwijzing. De voorbeeldgegevens hier zijn geen vastgestelde leeftijds- of doseringsadviezen.','Daily Stack is the adult sachet format. Kids Gummies is the children’s gummy format. Each has its own formula and directions. The sample data here is not finalized age or dosage guidance.')],
[t('Kan ik smaken combineren?','Can I combine flavors?'),t('Met de Flavor Duo kies je twee smaken in één pakket. De gezinsbundel combineert een volwassenensmaak met Kids Strawberry. Beide voorbeelden staan bij Bundels.','Flavor Duo lets you choose two flavors in one pack. The family bundle combines an adult flavor with Kids Strawberry. Find both examples under Bundles.')],
[t('Met welke smaak begin ik?','Which flavor should I start with?'),t('Kies de naam die je het meest aanspreekt: fruitig, citrus of ijsthee. Elke kaart vermeldt het aantal smaken. Kies je smaak op de productpagina. Citrus Mint is in deze demo tijdelijk uitverkocht.','Choose the name that appeals to you: fruit, citrus or iced tea. Each card shows the number of flavors. Choose your flavor on the product page. Citrus Mint is temporarily sold out in this demo.')],
[t('Kan ik later van smaak wisselen?','Can I change flavor later?'),t('Ja, in de voorbeeldvoorwaarden wijzig je jouw smaak via je account tot 48 uur vóór de volgende verlenging. Verzending is gratis bij abonnementen; eenmalig € 4,95, gratis vanaf € 50. De garantie is voor elke aankoop 30 dagen niet-goed-geld-terug.','Yes. Under the sample terms, change your flavor in your account until 48 hours before renewal. Subscription shipping is free; one-time shipping is €4.95, free from €50. Every purchase has a 30-day money-back guarantee.')]
];}
let sheet=null,lastFocus=null,draft=null;
function openSheet(title,body,footer=''){lastFocus=document.activeElement;sheet=document.createElement('dialog');sheet.className='sheet';sheet.setAttribute('aria-label',title);sheet.innerHTML=`<div class="sheet-inner"><header class="sheet-head"><h2>${title}</h2><button data-close aria-label="${t('Sluiten','Close')}">×</button></header><div class="sheet-scroll">${body}</div>${footer?`<footer class="sheet-foot">${footer}</footer>`:''}</div>`;document.body.append(sheet);sheet.querySelector('[data-close]').onclick=closeSheet;sheet.addEventListener('cancel',e=>{e.preventDefault();closeSheet();});document.body.style.overflow='hidden';sheet.showModal();sheet.querySelector('[data-close]').focus();}
function closeSheet(){if(sheet){sheet.close();sheet.remove();sheet=null;document.body.style.overflow='';lastFocus?.focus();}}
function toggleFilter(f,k,v,checked){f[k]=checked?[...new Set([...f[k],v])]:f[k].filter(x=>x!==v);}
function filterSheet(){draft=structuredClone(state.filters);openSheet(t('Filter producten','Filter products'),filterFields(draft,'sheet'),`<button data-clear-draft>${t('Wis alles','Clear all')}</button><button class="primary" data-apply>${t('Toon','Show')} ${resultProducts(draft).length} ${t('producten','products')}</button>`);bindDraft();sheet.querySelector('[data-clear-draft]').onclick=()=>{draft=structuredClone(EMPTY);refreshDraft();};sheet.querySelector('[data-apply]').onclick=()=>{state.filters=structuredClone(draft);alignVariants();closeSheet();syncUrl();rerender('[data-action="filters-sheet"]');};}
function bindDraft(){sheet.querySelectorAll('[data-filter]').forEach(i=>i.onchange=()=>{toggleFilter(draft,i.dataset.filter,i.dataset.value,i.checked);refreshDraft(i.dataset.filter,i.dataset.value);});}
function refreshDraft(k,v){const y=sheet.querySelector('.sheet-scroll').scrollTop;sheet.querySelector('.sheet-scroll').innerHTML=filterFields(draft,'sheet');sheet.querySelector('[data-apply]').textContent=t('Toon','Show')+' '+resultProducts(draft).length+' '+t('producten','products');bindDraft();if(k)sheet.querySelector(`[data-filter="${k}"][data-value="${v}"]`)?.focus({preventScroll:true});sheet.querySelector('.sheet-scroll').scrollTop=y;}
function sortSheet(){let selected=state.sort;openSheet(t('Sorteer producten','Sort products'),sorts().map(([id,label])=>`<label class="sort-option"><input type="radio" name="sheet-sort" value="${id}" ${state.sort===id?'checked':''}>${label}</label>`).join(''),`<button class="primary" data-apply>${t('Toepassen','Apply')}</button>`);sheet.querySelectorAll('input').forEach(i=>i.onchange=()=>selected=i.value);sheet.querySelector('[data-apply]').onclick=()=>{state.sort=selected;closeSheet();syncUrl();rerender('[data-action="sort-sheet"]');};}
function restock(){openSheet(t('Citrus Mint is even uitverkocht.','Citrus Mint is temporarily sold out.'),`<div class="dialog-copy"><div class="small-preview"><strong>Daily Stack</strong><p>Citrus Mint · 30 × 7g</p></div><p>${t('Laat je e-mailadres achter voor een melding zodra deze smaak terug is.','Leave your email for a notification when this flavor is back.')}</p><form class="restock-form"><label for="restock-email">${t('E-mailadres','Email address')}</label><input id="restock-email" type="email" required placeholder="${t('jij@voorbeeld.nl','you@example.com')}"><button class="primary" type="submit">${t('Houd me op de hoogte','Notify me')}</button><p class="fine">${t('Demo: geen opslag of verzending.','Demo: nothing is stored or sent.')}</p></form></div>`);sheet.querySelector('form').onsubmit=e=>{e.preventDefault();sheet.querySelector('.sheet-scroll').innerHTML=`<div class="dialog-copy" style="padding-top:30px"><h3>${t('Demo afgerond','Demo complete')}</h3><p>${t('Je e-mailadres is niet opgeslagen. Er wordt geen melding verzonden.','Your email was not stored. No notification will be sent.')}</p></div>`;};}
function preview(id){const p=products.find(p=>p.id===id);if(id==='kids'){openSheet('Kids Gummies',`<div class="dialog-copy"><div class="small-preview"><strong>Kids ${selectedFlavor(p)}</strong><p>${t('Gummies · 30 porties','Gummies · 30 servings')}</p></div><p>${euro(2499)}${t('/maand','/month')} · ${euro(83)}${t('/dag','/day')}</p><p>${t('Deze productpreview toont de gekozen smaak. De volledige Kids-PDP volgt in een aparte ronde; leeftijd, dosering en geschiktheid zijn nog geen vastgestelde productspecificaties.','This product preview shows the selected flavor. The full Kids PDP will follow in a separate round; age, dosage and suitability are not finalized product specifications.')}</p></div>`);return;}openSheet('Flavor Duo',`<div class="dialog-copy"><div class="small-preview"><strong>${t('Twee smaken. Eén pakket.','Two flavors. One pack.')}</strong><p>2 × 30 ${t('sachets','sachets')}</p></div><div class="bundle-picks">${[1,2].map((n)=>`<label>${t('Doos','Box')} ${n}<select id="duo-${n}">${FLAVORS.map((f,i)=>`<option value="${i}" ${(n===1?state.variants.duo===i:i===1)?'selected':''}>${f}</option>`).join('')}</select></label>`).join('')}</div><p><strong>${euro(5698)}</strong> ${t('per levering van 60 sachets','per delivery of 60 sachets')}<br>${euro(95)}${t('/dag bij 60 dagen voorraad','/day for a 60-day supply')}<br>${t('5% bundelvoordeel','5% bundle savings')}</p><div id="duo-summary" class="fine">${t('Smaakkeuze voor dit voorbeeldpakket.','Flavor selection for this sample pack.')}</div><p class="sample-label">${t('Dit is een bundelpreview. Er wordt geen bestelling geplaatst.','This is a bundle preview. No order is placed.')}</p></div>`,`<button class="primary" data-duo-save>${t('Bekijk je combinatie','View your combination')}</button>`);sheet.querySelector('[data-duo-save]').onclick=()=>{const a=FLAVORS[Number(sheet.querySelector('#duo-1').value)],b=FLAVORS[Number(sheet.querySelector('#duo-2').value)];sheet.querySelector('#duo-summary').innerHTML=`<b>${a} + ${b}</b><br>${t('Voorbeeldselectie gereed. Geen bestelling geplaatst.','Sample selection ready. No order placed.')}`;};}
function rerender(selector){const y=scrollY;const open=[...document.querySelectorAll('details')].map(x=>x.open);render();document.querySelectorAll('details').forEach((d,i)=>d.open=!!open[i]);if(selector)document.querySelector(selector)?.focus({preventScroll:true});scrollTo(0,y);}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='desktop'||a==='mobile'){state.mobile=a==='mobile';syncUrl();rerender('[data-action="'+a+'"]');}else if(a==='sidebar'){state.sidebar=!state.sidebar;rerender();}else if(a==='locale'){state.lang=state.lang==='nl'?'en':'nl';syncUrl();rerender();}else if(a==='clear'){state.filters=structuredClone(EMPTY);syncUrl();rerender();}else if(a==='filters-sheet'){filterSheet();}else if(a==='sort-sheet'){sortSheet();}else if(a==='homepage'){location.href=homeUrl();}else if(a==='compare'){state.compare=!state.compare;rerender('[data-action="compare"]');}else if(a==='print'){window.print();}});
document.querySelectorAll('[data-filter]').forEach(i=>i.onchange=()=>{toggleFilter(state.filters,i.dataset.filter,i.dataset.value,i.checked);alignVariants();syncUrl();rerender(`[data-filter="${i.dataset.filter}"][data-value="${i.dataset.value}"]`);});
document.querySelectorAll('[data-remove-key]').forEach(b=>b.onclick=()=>{toggleFilter(state.filters,b.dataset.removeKey,b.dataset.removeValue,false);syncUrl();rerender();});
document.querySelectorAll('[data-restock]').forEach(b=>b.onclick=restock);document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>preview(b.dataset.preview));const sort=document.getElementById('sort');if(sort)sort.onchange=e=>{state.sort=e.target.value;syncUrl();rerender('#sort');};
document.querySelectorAll('a[href="#comparison"]').forEach(a=>a.onclick=()=>{if(!state.compare){state.compare=true;rerender();}});}
window.addEventListener('popstate',()=>{params();alignVariants();render();});
params();alignVariants();render();
</script></body></html>
